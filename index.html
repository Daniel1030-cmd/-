<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="팀별 주간업무보고 작성·열람 시스템">
<meta name="theme-color" content="#17202A">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>주간업무보고 (WBR)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5F7;--ink:#17202A;--mute:#6B7683;--line:#DDE2E7;--card:#fff;--acc:#0F766E;--accd:#0B5A54;--warn:#B45309;--bad:#BE123C;--ok:#15803D;--side:#17202A}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.6 'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hide{display:none!important}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:32px;width:380px;max-width:100%}
.box h1{font-size:20px;margin-bottom:4px}.box p{color:var(--mute);margin-bottom:18px}
#app{display:flex;min-height:100vh}
aside{width:210px;background:var(--side);color:#cfd6dd;padding:18px 12px;position:sticky;top:0;height:100vh;flex-shrink:0;display:flex;flex-direction:column;gap:2px}
aside h2{color:#fff;font-size:15px;padding:4px 10px 14px}
aside a{padding:9px 10px;border-radius:6px;cursor:pointer;color:inherit}
aside a:hover{background:#ffffff14}aside a.on{background:var(--acc);color:#fff}
.me{margin-top:auto;font-size:12px;padding:10px;border-top:1px solid #ffffff22}
main{flex:1;padding:26px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1.t{font-size:21px}.sub{color:var(--mute);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tc{cursor:pointer;transition:border-color .15s}.tc:hover{border-color:var(--acc)}
.tc b{display:block;font-size:15px;margin-bottom:6px}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 13px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}.btn.p:hover{background:var(--accd)}
.btn.d{color:var(--bad)}.btn.s{padding:3px 9px;font-size:12px}
.in{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff}
textarea.in{resize:vertical;min-height:130px;line-height:1.7}
label.l{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:700;background:#E8EBEE;color:var(--mute)}
.tag.draft{background:#FEF3C7;color:var(--warn)}.tag.done{background:#DCFCE7;color:var(--ok)}.tag.late{background:#FFE4E6;color:var(--bad)}.tag.prog{background:#CCFBF1;color:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.iss{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;background:#FAFBFC}
.irow{display:grid;grid-template-columns:3fr 1fr 1fr 1fr auto;gap:8px;align-items:end}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--mute);padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid #EEF0F2;vertical-align:middle}
.scroll{overflow-x:auto}
.rp h2{font-size:18px;margin-bottom:12px}.rp h3{font-size:13px;color:var(--acc);margin:14px 0 6px;border-bottom:2px solid var(--acc);padding-bottom:3px}
.rp ol{padding-left:20px}.rp .c{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.rp .is{margin-bottom:8px}.rp .is>div:first-child{display:flex;justify-content:space-between;font-weight:700}
.rp .is div.s{padding-left:18px;color:#3B4652;font-weight:400}
.rp hr{border:0;border-top:1px dashed var(--line);margin:22px 0}
#modal{position:fixed;inset:0;background:#0f172a99;display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto;z-index:50}
#modal>div{background:#fff;border-radius:10px;padding:24px;width:860px;max-width:100%}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tc2{background:#fff;border:1px solid var(--line);border-left:5px solid var(--line);border-radius:8px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:9px;transition:box-shadow .15s}
.tc2:hover{box-shadow:0 3px 12px #0001}.tc2.m{border-left-color:var(--bad)}.tc2.d{border-left-color:#D97706}.tc2.s{border-left-color:var(--ok)}
.tc2 .kv span:not(.tag){font-weight:700;font-size:17px}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:#E3E7EB}.stack i{display:block;transition:width .4s}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:13px;align-items:center}.legend b{font-size:17px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.mini{height:6px;background:#E3E7EB;border-radius:99px;overflow:hidden}.mini i{display:block;height:100%;background:var(--acc)}
.sheet{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.actbar{position:sticky;top:0;z-index:5;background:#fffffff0;backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.actbar h2{font-size:21px;line-height:1.2;letter-spacing:-.4px}
.sheet-b{padding:4px 24px 28px}
.note{border-radius:8px;padding:11px 14px;margin-top:14px;font-size:13px;background:#F3F5F7;color:#3B4652;white-space:pre-wrap}
.note.ok{background:#ECFDF3;color:#15803D;font-weight:500}.note.acc{background:#E6F2F0;color:#0B5A54}
.sec{margin-top:28px}
.sec>h3,.cols2 h4{font-size:15px;display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-left:10px;border-left:4px solid var(--acc);line-height:1.3}
.cnt{margin-left:auto;font-size:12px;font-weight:400;color:var(--mute)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.pta{width:100%;min-height:210px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:#FBFCFD;line-height:1.9;resize:vertical}
.pta:focus,.in-title:focus{outline:0;border-color:var(--acc)}.pta:focus{background:#fff;box-shadow:0 0 0 3px #0F766E1f}
.pta:disabled,.in-title:disabled,.in:disabled{background:#F3F5F7;color:#6B7683;cursor:not-allowed}
.iss2{display:flex;gap:14px;border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:8px;padding:14px;margin-bottom:10px;background:#fff}
.iss2.is1{border-left-color:var(--ok)}.iss2.is2{border-left-color:var(--bad)}
.inum{flex:0 0 26px;height:26px;border-radius:50%;background:#17202A;color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:4px}
.ibody{flex:1;min-width:0}
.in-title{width:100%;border:0;border-bottom:1.5px solid var(--line);padding:6px 2px;font-size:16px;font-weight:700;background:transparent;border-radius:0}
.imeta{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin:10px 0}
.imeta label{font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:3px}
.imeta .in{width:130px;padding:6px 9px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);background:#fff;padding:7px 13px;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--mute)}
.seg button:last-child{border-right:0}.seg button:disabled{cursor:not-allowed}
.seg button.on{color:#fff}.seg button.on.s0{background:var(--acc)}.seg button.on.s1{background:var(--ok)}.seg button.on.s2{background:var(--bad)}
.addrow{width:100%;border:1.5px dashed #C5CBD2;background:transparent;border-radius:8px;padding:10px;color:var(--mute);cursor:pointer}.addrow:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
#modal hr{border:0;border-top:1px dashed var(--line);margin:30px 0}
@media(max-width:800px){.cols2{grid-template-columns:1fr}.sheet-b{padding:4px 14px 20px}.actbar{padding:10px 14px}}
.menu{display:none}
@media(max-width:800px){aside{position:fixed;z-index:30;transform:translateX(-100%);transition:transform .2s}aside.open{transform:none}.menu{display:inline-block}.two,.rp .c{grid-template-columns:1fr}.irow{grid-template-columns:1fr 1fr}main{padding:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:80}.toast{background:#17202A;color:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 6px 20px #0003;max-width:340px;white-space:pre-wrap}.toast.err{background:var(--bad)}
.btn:disabled{opacity:.55;cursor:not-allowed}aside a[role=button]{display:block}
</style>
<noscript><p style="padding:24px">이 시스템은 JavaScript가 필요합니다.</p></noscript>
</head>
<body>

<div id="login">
 <div class="box">
  <h1>주간업무보고 (WBR)</h1><p id="lgSub">팀별 주간업무보고 작성 · 열람 시스템</p>
  <form id="lgForm">
   <div id="nmWrap" class="hide"><label class="l" for="lgNm">이름</label><input class="in" id="lgNm" name="name" autocomplete="name" maxlength="30"></div>
   <label class="l" for="lgEm">이메일</label><input class="in" id="lgEm" type="email" name="email" required autocomplete="username">
   <label class="l" for="lgPw">비밀번호 (6자 이상)</label><input class="in" id="lgPw" type="password" name="pw" required minlength="6" autocomplete="current-password">
   <div id="lgErr" role="alert" class="sub" style="color:var(--bad);margin-top:8px"></div>
   <button class="btn p" style="width:100%;margin-top:12px" id="lgBtn">로그인</button>
  </form>
  <button class="btn s" style="margin-top:12px;border:0" id="lgToggle" type="button">계정이 없으신가요? 가입하기</button>
 </div>
</div>

<div id="app" class="hide">
 <aside id="side">
  <h2>주간업무보고</h2>
  <a data-v="home" id="navHome">현황</a>
  <a data-v="write">보고서 작성</a>
  <a data-v="list" id="navList">보고서 열람</a>
  <a data-v="admin" id="navAdmin" class="hide">팀 · 권한 관리</a>
  <div class="me"><div id="meTxt"></div><button class="btn s" id="logout" style="margin-top:8px">로그아웃</button></div>
 </aside>
 <main><button class="btn menu" id="menuBtn" style="margin-bottom:12px">☰ 메뉴</button><div id="errBar" role="alert" class="card hide" style="border-color:var(--bad);color:var(--bad)"></div><div id="view"><p class="sub">불러오는 중...</p></div></main>
</div>
<div id="modal" class="hide"></div>
<div id="toasts" aria-live="polite"></div>

<script type="module">
/*
 * WBR — 주간업무보고
 * 구조: Auth(이메일) → users/{uid}(role·team) → teams, config/template, reports/{주차_팀}
 * 보안: 화면의 권한 분기는 UX용일 뿐이며 실제 강제는 Firestore 보안 규칙(firestore.rules)이 담당합니다. 반드시 배포하세요.
 * 동시성: 보고서마다 rev 번호를 두고 트랜잭션으로 충돌/제출 잠금 우회를 차단합니다.
 */
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,writeBatch,addDoc,updateDoc,deleteDoc,onSnapshot,query,where,serverTimestamp,runTransaction} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ⚠ 본인의 Firebase 프로젝트 설정으로 교체하세요 (CRM과 같은 프로젝트를 써도 컬렉션이 달라 충돌하지 않습니다) */
const cfg={
  apiKey:"AIzaSyA1wwPmNs9Y_MVCANN6iqj0Nn6H1YHvm3w",
  authDomain:"recruitments-1d3a0.firebaseapp.com",
  projectId:"recruitments-1d3a0",
  storageBucket:"recruitments-1d3a0.firebasestorage.app",
  messagingSenderId:"115005966065",
  appId:"1:115005966065:web:7f6320ef3a862d888c8b50"
};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);

const ROLE={pending:"승인대기",member:"팀원",leader:"팀장",exec:"임원(전체열람)",admin:"관리자"};
const ISS_ST=["진행중","완료","지연"];
const $=s=>document.querySelector(s);
const esc=s=>s==null?"":String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
const iso=k=>`${k.slice(0,4)}-${k.slice(4,6)}-${k.slice(6)}`;
const defWk=()=>toFri(ymd(new Date()));
/* 작성 기준일 = 해당 주(월~금)의 마지막 근무일 (공휴일 제외). 내장 목록은 2026년, 이후 연도는 관리자 화면에서 추가 */
const HOL0=["2026-01-01","2026-02-16","2026-02-17","2026-02-18","2026-03-01","2026-03-02","2026-05-01","2026-05-05","2026-05-24","2026-05-25","2026-06-03","2026-06-06","2026-08-15","2026-08-17","2026-09-24","2026-09-25","2026-09-26","2026-10-03","2026-10-05","2026-10-09","2026-12-25"];
const toFri=k=>{const d=new Date(+k.slice(0,4),+k.slice(4,6)-1,+k.slice(6)),H=new Set([...HOL0,...(tpl.holidays||[])]);
  if(d.getDay()===6)d.setDate(d.getDate()+2);else if(d.getDay()===0)d.setDate(d.getDate()+1);
  d.setDate(d.getDate()-((d.getDay()+6)%7)+4);const fri=ymd(d);
  for(let i=0;i<5;i++){if(!H.has(`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`))return ymd(d);d.setDate(d.getDate()-1)}
  return fri};
const lines=s=>(s||"").split("\n").map(x=>x.trim()).filter(Boolean);
const fmt=t=>{if(!t)return"-";const d=t.toDate?t.toDate():new Date(t);return d.toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})};
const title=wk=>{if(!/^\d{8}$/.test(wk))return"-";const d=new Date(+wk.slice(0,4),+wk.slice(4,6)-1,+wk.slice(6));d.setDate(d.getDate()-((d.getDay()+6)%7)+4);return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${Math.ceil(d.getDate()/7)}주차`}; /* 그 주 금요일이 속한 달 기준 N주차 */
function toast(m,err){const e=document.createElement("div");err=err??/오류|실패|차단|권한|이미|입력하세요/.test(m);e.className="toast"+(err?" err":"");e.textContent=m;$("#toasts").append(e);setTimeout(()=>e.remove(),err?6000:3200)}
const rid=(wk,t)=>`${wk}_${t}`;

const TPL0={thisLabel:"금주 진행사항",nextLabel:"차주 진행사항",issueLabel:"이슈사항",dueLabel:"완료예정",suffix:"주차-WBR",guide:"",thisHint:"",nextHint:"",extras:[],holidays:[]};
let tpl={...TPL0},carry=null,autoT=null,tplDraft=null,notif={};
let me=null,teams=[],users=[],reports=[],view="home",wk=defWk(),editTeam=null,draft=null,fl={wk:"",team:"",st:"",q:""},unsubs=[];
const priv=()=>me&&(me.role==="admin"||me.role==="exec");
const canWrite=t=>me&&(me.role==="admin"||(["member","leader"].includes(me.role)&&me.team===t));
const isLead=()=>me&&(me.role==="admin"||me.role==="leader");
const teamName=id=>(teams.find(t=>t.id===id)||{}).name||"(팀 없음)";
const getR=(w,t)=>reports.find(r=>r.id===rid(w,t));
const stTag=r=>!r?`<span class="tag late">미작성</span>`:r.status==="제출완료"?`<span class="tag done">제출완료</span>`:`<span class="tag draft">작성중</span>`;

/* ───── 인증 ───── */
let signup=false;
$("#lgToggle").onclick=()=>{signup=!signup;$("#nmWrap").classList.toggle("hide",!signup);$("#lgBtn").textContent=signup?"가입하기":"로그인";$("#lgToggle").textContent=signup?"이미 계정이 있습니다. 로그인":"계정이 없으신가요? 가입하기";$("#lgPw").autocomplete=signup?"new-password":"current-password";$("#lgErr").textContent=""};
$("#lgForm").onsubmit=async e=>{
  e.preventDefault();const f=new FormData(e.target),em=f.get("email").trim(),pw=f.get("pw");$("#lgErr").textContent="";const lb=$("#lgBtn");lb.disabled=true;
  try{
    if(signup){
      const nm=(f.get("name")||"").trim(); if(!nm){$("#lgErr").textContent="이름을 입력하세요.";return}
      const c=await createUserWithEmailAndPassword(auth,em,pw);
      await setDoc(doc(db,"users",c.user.uid),{name:nm,email:em,role:"pending",team:"",createdAt:serverTimestamp()});
    }else await signInWithEmailAndPassword(auth,em,pw);
  }catch(err){$("#lgErr").textContent=({"auth/invalid-credential":"이메일 또는 비밀번호가 올바르지 않습니다.","auth/email-already-in-use":"이미 가입된 이메일입니다.","auth/weak-password":"비밀번호는 6자 이상이어야 합니다."})[err.code]||err.message}
  finally{lb.disabled=false}
};
$("#logout").onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{
  unsubs.forEach(f=>f());unsubs=[];me=null;
  if(!u){$("#login").classList.remove("hide");$("#app").classList.add("hide");return}
  $("#login").classList.add("hide");$("#app").classList.remove("hide");
  unsubs.push(onSnapshot(doc(db,"users",u.uid),s=>{
    if(!s.exists()){me=null;vSetup(u);return}
    hideErr();
    const first=!me,old=me;me={id:u.uid,...s.data()};
    $("#meTxt").innerHTML=`<b>${esc(me.name)}</b><br>${ROLE[me.role]||me.role}`;
    $("#navAdmin").classList.toggle("hide",me.role!=="admin");
    $("#navHome").classList.toggle("hide",!priv());$("#navList").classList.toggle("hide",!priv());
    if(!priv()&&(view==="home"||view==="list"))view="write";
    if(first||old.role!==me.role||old.team!==me.team) startData();
    render();
  },showErr));
});
function startData(){
  unsubs.slice(1).forEach(f=>f());unsubs=unsubs.slice(0,1);
  unsubs.push(onSnapshot(collection(db,"teams"),s=>{teams=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0));rr()},showErr));
  unsubs.push(onSnapshot(doc(db,"config","template"),s=>{const d=s.exists()?s.data():{};tpl={...TPL0,...d,extras:d.extras||[]};tpl.suffix=String(tpl.suffix||TPL0.suffix).replace(/[<>&"'`]/g,"").slice(0,30);tpl.holidays=(tpl.holidays||[]).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x));rr()},showErr));
  if(me.role==="pending")return;
  const q=priv()?collection(db,"reports"):(me.team?query(collection(db,"reports"),where("teamId","==",me.team)):null);
  if(q)unsubs.push(onSnapshot(q,s=>{reports=s.docs.map(d=>({id:d.id,...d.data()}));rr()},showErr));
  if(me.role==="admin")unsubs.push(onSnapshot(collection(db,"users"),s=>{users=s.docs.map(d=>({id:d.id,...d.data()}));rr()},showErr));
  if(me.role==="admin")unsubs.push(onSnapshot(doc(db,"config","notify"),s=>{notif=s.exists()?s.data():{};rr()},showErr));
}

/* ───── 보고서 표시/내보내기 ───── */

function repText(r){
  const o=[`${title(r.weekKey)} [${r.teamName||teamName(r.teamId)}]`,"",tpl.thisLabel,...lines(r.thisWeek).map((x,i)=>` ${i+1}. ${x}`),"",tpl.nextLabel,...lines(r.nextWeek).map((x,i)=>` ${i+1}. ${x}`),"",`${tpl.issueLabel} | ${tpl.dueLabel}`];

  const md=$("#modal"),back=document.activeElement;md.setAttribute("role","dialog");md.setAttribute("aria-modal","true");md.setAttribute("aria-label",head);md.classList.remove("hide");
  const onKey=e=>{if(e.key==="Escape")close()},close=()=>{md.classList.add("hide");document.removeEventListener("keydown",onKey);back&&back.focus&&back.focus()};

function initDraft(){
  const r=getR(wk,editTeam),blank={title:"",due:"",status:"진행중",owner:"",items:""};
  carry=null;
  if(r)draft={thisWeek:r.thisWeek||"",nextWeek:r.nextWeek||"",issues:(r.issues||[]).map(i=>({...i,items:(i.items||[]).join("\n")})),status:r.status,rev:r.rev||0};
  else{
    const prev=reports.filter(x=>x.teamId===editTeam&&x.weekKey<wk).sort((x,y)=>y.weekKey.localeCompare(x.weekKey))[0];
    draft={thisWeek:prev?prev.nextWeek||"":"",nextWeek:"",issues:prev?(prev.issues||[]).filter(i=>i.status!=="완료").map(i=>({...i,items:(i.items||[]).join("\n")})):[],status:"",rev:0};
    if(prev&&(draft.thisWeek||draft.issues.length))carry=prev.weekKey;
  }
  draft.extra=tpl.extras.map(e=>{const o=r&&(r.extra||[]).find(x=>x.id===e.id);return{id:e.id,label:e.label,text:o?o.text:""}});
  if(!draft.issues.length)draft.issues.push({...blank});
}

  <div class="sec"><h3>${esc(tpl.issueLabel)}<span class="cnt">${draft.issues.length}건 · ${esc(tpl.dueLabel)} 기준</span></h3>
  ${draft.issues.map((i,n)=>`<div class="iss2 is${idx(i.status)}"><div class="inum">${n+1}</div><div class="ibody">
   <input class="in-title" data-i="${n}" data-k="title" value="${esc(i.title)}" placeholder="이슈 제목 (예: 사규 정리)" ${dis}>
   <div class="imeta"><label>${esc(tpl.dueLabel)}<input class="in" data-i="${n}" data-k="due" value="${esc(i.due)}" placeholder="10/10" ${dis}></label>
    <label>담당자<input class="in" data-i="${n}" data-k="owner" value="${esc(i.owner)}" ${dis}></label>
    <div class="seg">${ISS_ST.map((x,k)=>`<button type="button" class="s${k} ${i.status===x?"on":""}" data-sg="${n}:${x}" aria-pressed="${i.status===x}" ${dis}>${x}</button>`).join("")}</div>
    <button class="btn s d" data-del="${n}" ${dis} style="margin-left:auto">삭제</button></div>
   <textarea class="in" style="min-height:64px;line-height:1.8" placeholder="세부 내용 (한 줄에 한 항목 → 1) 2) 로 표시)" data-i="${n}" data-k="items" ${dis}>${esc(i.items)}</textarea></div></div>`).join("")}
  <button class="addrow" id="addIss" ${dis}>+ 이슈 추가</button></div>
  ${draft.extra.map((e,n)=>`<div class="sec"><h3>${esc(e.label)}</h3><textarea class="pta" style="min-height:100px" data-x="${n}" ${dis}>${esc(e.text)}</textarea></div>`).join("")}
  </div></div>`;
  M.querySelectorAll("[data-sg]").forEach(b=>b.onclick=()=>{const[n,st]=b.dataset.sg.split(":");draft.issues[+n].status=st;render();schedAuto()});
  bindWk();
  const ts=$("#tmSel");if(ts)ts.onchange=async()=>{await flush();editTeam=ts.value;draft=null;render()};
  M.oninput=M.onchange=e=>{const t=e.target;if(t.dataset.f){draft[t.dataset.f]=t.value;const c=$("#cnt-"+t.dataset.f);if(c)c.textContent=lines(t.value).length+"개 항목"}else if(t.dataset.x!==undefined)draft.extra[+t.dataset.x].text=t.value;else if(t.dataset.i!==undefined)draft.issues[+t.dataset.i][t.dataset.k]=t.value;else return;schedAuto()};
  $("#addIss").onclick=()=>{draft.issues.push({title:"",due:"",status:"진행중",owner:"",items:""});render()};
  M.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{draft.issues.splice(+b.dataset.del,1);if(!draft.issues.length)draft.issues.push({title:"",due:"",status:"진행중",owner:"",items:""});render()});
  $("#save").onclick=()=>save(draft.status||"작성중");
  const sb=$("#submit");if(sb)sb.onclick=async()=>{if(!confirm("제출하면 더 이상 수정하거나 다시 제출할 수 없습니다. (제출 취소는 팀장·관리자만 가능)\n제출할까요?"))return;sb.disabled=true;clearTimeout(autoT);autoT=null;await save("제출완료");sb.disabled=false};
  const ro=$("#reopen");if(ro)ro.onclick=()=>save("작성중",false,{reopen:true});
  $("#prev").onclick=()=>showReports([toDoc("작성중")],title(wk)+" 미리보기");
}
const toDoc=st=>({id:rid(wk,editTeam),weekKey:wk,teamId:editTeam,teamName:teamName(editTeam),thisWeek:draft.thisWeek,nextWeek:draft.nextWeek,issues:draft.issues.filter(i=>i.title.trim()||i.items.trim()).map(i=>({title:i.title.trim(),due:i.due.trim(),status:i.status,owner:i.owner.trim(),items:lines(i.items)})),extra:draft.extra.filter(e=>e.text.trim()).map(e=>({id:e.id,label:e.label,text:e.text})),status:st,updatedBy:me.id,updatedByName:me.name,updatedAt:new Date()});
async function save(st,silent,o={}){
  if(!draft||!editTeam)return;
  const z=toDoc(st);
  if(silent&&!z.thisWeek.trim()&&!z.nextWeek.trim()&&!z.issues.length&&!z.extra.length)return;
  const ref=doc(db,"reports",rid(wk,editTeam)),d={...z};delete d.id;d.updatedAt=serverTimestamp();if(st==="제출완료")d.submittedAt=serverTimestamp();
  try{
    const rev=await runTransaction(db,async tx=>{
      const snap=await tx.get(ref),cur=snap.exists()?snap.data():null;
      if(cur&&cur.status==="제출완료"&&!o.reopen)throw Object.assign(new Error("이미 제출된 보고서입니다."),{code:"locked"});
      if(cur&&!o.force&&(cur.rev||0)!==(draft.rev||0))throw Object.assign(new Error("다른 사용자가 먼저 수정했습니다."),{code:"conflict"});
      const n=(cur&&cur.rev||0)+1;d.rev=n;tx.set(ref,d,{merge:true});return n});
    draft.rev=rev;draft.status=st;
    if(!silent){toast(st==="제출완료"?"제출되었습니다.":"저장되었습니다.");render()}
  }catch(e){
    if(e.code==="conflict"&&!silent&&confirm("다른 사용자가 이 보고서를 먼저 수정했습니다.\n내 내용으로 덮어쓸까요?"))return save(st,silent,{...o,force:true});
    if(silent)throw e;toast("저장 오류: "+e.message,true)}
}

function vList(){

  l.sort((a,b)=>b.weekKey.localeCompare(a.weekKey)||(a.teamName||"").localeCompare(b.teamName||"","ko"));
  M.innerHTML=`<div class="top"><div><h1 class="t">보고서 열람</h1><div class="sub">${priv()?"전체 팀 보고서를 열람할 수 있습니다":"소속 팀 보고서만 열람할 수 있습니다"} · ${l.length}건</div></div>
  ${priv()&&fl.wk?`<button class="btn p" id="merge">${title(fl.wk)} 통합 보기</button>`:""}</div>
  <div class="card"><div class="bar"><select class="in" style="width:170px" data-fl="wk"><option value="">전체 주차</option>${wks.map(w=>`<option ${fl.wk===w?"selected":""} value="${w}">${title(w)}</option>`).join("")}</select>
  ${priv()?`<select class="in" style="width:150px" data-fl="team"><option value="">전체 팀</option>${teams.map(t=>`<option value="${t.id}" ${fl.team===t.id?"selected":""}>${esc(t.name)}</option>`).join("")}</select>`:""}
  <select class="in" style="width:130px" data-fl="st"><option value="">전체 상태</option><option ${fl.st==="작성중"?"selected":""}>작성중</option><option ${fl.st==="제출완료"?"selected":""}>제출완료</option></select>
  <input class="in" style="flex:1;min-width:160px" id="flQ" placeholder="내용 검색" value="${esc(fl.q)}"></div></div>
  <div class="card scroll" style="padding:0"><table><thead><tr><th>주차</th><th>팀</th><th>상태</th><th>이슈</th><th>최종 수정</th><th></th></tr></thead><tbody>
  ${l.map(r=>`<tr><td>${title(r.weekKey)}</td><td>${esc(r.teamName||teamName(r.teamId))}</td><td>${stTag(r)}</td><td>${(r.issues||[]).filter(i=>i.status!=="완료").length}건 진행</td><td class="sub">${esc(r.updatedByName||"")} · ${fmt(r.updatedAt)}</td><td><button class="btn s" data-view="${r.id}">열람</button></td></tr>`).join("")||`<tr><td colspan="6" class="sub" style="text-align:center;padding:30px">조건에 맞는 보고서가 없습니다.</td></tr>`}</tbody></table></div>`;
  M.querySelectorAll("[data-fl]").forEach(s=>s.onchange=()=>{fl[s.dataset.fl]=s.value;render()});
  const q=$("#flQ");let qt;q.oninput=()=>{clearTimeout(qt);qt=setTimeout(()=>{fl.q=q.value.trim();render();const n=$("#flQ");n.focus();n.setSelectionRange(n.value.length,n.value.length)},250)};
  M.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>showReports([reports.find(r=>r.id===b.dataset.view)],title(reports.find(r=>r.id===b.dataset.view).weekKey)));
  const m=$("#merge");if(m)m.onclick=()=>showReports(reports.filter(r=>r.weekKey===fl.wk),title(fl.wk)+" 전체 팀 통합");
}

function tplCard(){
  if(!tplDraft)tplDraft=JSON.parse(JSON.stringify(tpl));
  const t=tplDraft,f=(k,l)=>`<div><label class="l">${l}</label><input class="in" data-t="${k}" value="${esc(t[k])}"></div>`,ta=(k,l)=>`<div><label class="l">${l}</label><textarea class="in" style="min-height:60px" data-t="${k}">${esc(t[k])}</textarea></div>`;
  return `<div class="card"><b>보고서 양식 설정</b><div class="sub">저장하면 모든 팀의 작성·열람 화면에 즉시 반영됩니다</div>
  <div class="two">${f("thisLabel","왼쪽 항목명")}${f("nextLabel","오른쪽 항목명")}${f("issueLabel","이슈 항목명")}${f("dueLabel","완료일 항목명")}</div>
  ${ta("guide","작성 안내문 (작성 화면 상단에 표시)")}<div class="two">${ta("thisHint","왼쪽 입력 예시")}${ta("nextHint","오른쪽 입력 예시")}</div>
  <label class="l">추가 휴일(빨간날) — 한 줄에 YYYY-MM-DD · 2026년 공휴일은 기본 내장, 2027년 이후는 여기에 추가</label><textarea class="in" style="min-height:70px" data-th placeholder="2027-01-01">${esc((t.holidays||[]).join("\n"))}</textarea>
  <label class="l">추가 항목 (예: 건의사항, 지원 요청)</label>
  ${t.extras.map((e,n)=>`<div class="bar" style="margin-bottom:6px"><input class="in" style="max-width:280px" data-te="${n}" value="${esc(e.label)}"><button class="btn s d" data-tx="${n}">삭제</button></div>`).join("")}
  <div class="bar" style="margin-top:8px"><button class="btn s" id="tAdd">+ 항목 추가</button><button class="btn p" id="tSave">양식 저장</button><button class="btn" id="tReset">기본값</button></div></div>`;
}

  return `<div class="card"><b>마감일 미작성 알림 메일</b><div class="sub">마감일(주 마지막 근무일) 오후 5시에 아직 제출하지 않은 팀 구성원의 가입 이메일로 자동 발송됩니다</div>

  <select class="in" style="width:170px" data-nf="target" aria-label="수신 대상"><option value="all" ${notif.target!=="leader"?"selected":""}>팀원 + 팀장 전체</option><option value="leader" ${notif.target==="leader"?"selected":""}>팀장만</option></select></div>
  <div class="sub" style="margin-top:8px">${lr?`최근 실행: ${esc(lr.weekKey)} · 발송 ${+lr.sent||0}건 · 실패 <b style="color:${lr.failed?"var(--bad)":"inherit"}">${+lr.failed||0}</b>건 · ${fmt(lr.at)}`:"최근 실행 기록 없음 (Cloud Functions 배포 후 표시됩니다)"}</div></div>`}
function vAdmin(){
  M.innerHTML=`<div class="top"><div><h1 class="t">팀 · 권한 관리</h1><div class="sub">가입한 사용자에게 팀과 권한을 지정합니다</div></div></div>
  ${notifCard()}${tplCard()}<div class="card"><b>팀</b><form id="tmForm" class="bar" style="margin:10px 0"><input class="in" style="max-width:240px" name="n" placeholder="팀 이름" required><button class="btn p">팀 추가</button></form>
  <div class="bar">${teams.map(t=>`<span class="tag" style="padding:4px 4px 4px 12px">${esc(t.name)} <button class="btn s d" data-dt="${t.id}" style="border:0;background:none">✕</button></span>`).join("")||"<span class='sub'>등록된 팀이 없습니다.</span>"}</div></div>
  <div class="card scroll" style="padding:0"><table><thead><tr><th>이름</th><th>이메일</th><th>팀</th><th>권한</th></tr></thead><tbody>
  ${users.map(u=>`<tr><td>${esc(u.name)}</td><td class="sub">${esc(u.email)}</td>
   <td><select class="in" data-u="${u.id}" data-k="team"><option value="">(없음)</option>${teams.map(t=>`<option value="${t.id}" ${u.team===t.id?"selected":""}>${esc(t.name)}</option>`).join("")}</select></td>
   <td><select class="in" data-u="${u.id}" data-k="role">${Object.entries(ROLE).map(([k,v])=>`<option value="${k}" ${u.role===k?"selected":""}>${v}</option>`).join("")}</select></td></tr>`).join("")}</tbody></table></div>
  <p class="sub">팀원: 소속 팀 작성 · 팀장: 작성 + 제출/재개 · 임원: 전체 열람(읽기 전용) · 관리자: 모든 권한</p>`;
  M.querySelectorAll("[data-nf]").forEach(el=>el.onchange=async()=>{try{await setDoc(doc(db,"config","notify"),{[el.dataset.nf]:el.type==="checkbox"?el.checked:el.value},{merge:true});toast("알림 설정이 저장되었습니다.")}catch(e){showErr(e)}});
  M.querySelectorAll("[data-t]").forEach(el=>el.oninput=()=>{tplDraft[el.dataset.t]=el.value});
  M.querySelectorAll("[data-te]").forEach(el=>el.oninput=()=>{tplDraft.extras[+el.dataset.te].label=el.value});
  M.querySelectorAll("[data-th]").forEach(el=>el.oninput=()=>{tplDraft.holidays=lines(el.value).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x))});
  M.querySelectorAll("[data-tx]").forEach(b=>b.onclick=()=>{tplDraft.extras.splice(+b.dataset.tx,1);render()});
  $("#tAdd").onclick=()=>{tplDraft.extras.push({id:"x"+Date.now(),label:""});render()};
  $("#tSave").onclick=async()=>{const t=tplDraft;t.extras=t.extras.filter(e=>e.label.trim());t.suffix=(t.suffix||"").trim()||TPL0.suffix;t.holidays=[...new Set(t.holidays||[])].sort();try{await setDoc(doc(db,"config","template"),t);tplDraft=null;toast("양식이 저장되었습니다. 모든 팀에 즉시 반영됩니다.")}catch(e){showErr(e)}};
  $("#tReset").onclick=()=>{if(confirm("기본 양식으로 되돌릴까요?")){tplDraft={...TPL0,extras:[]};render()}};
  $("#tmForm").onsubmit=async e=>{e.preventDefault();const n=new FormData(e.target).get("n").trim();if(n){await addDoc(collection(db,"teams"),{name:n,order:teams.length});e.target.reset()}};
  M.querySelectorAll("[data-dt]").forEach(b=>b.onclick=async()=>{if(confirm("팀을 삭제할까요? (기존 보고서는 유지됩니다)"))await deleteDoc(doc(db,"teams",b.dataset.dt))});
  M.querySelectorAll("[data-u]").forEach(s=>s.onchange=async()=>{
    if(s.dataset.u===me.id&&s.dataset.k==="role"&&s.value!=="admin"&&!confirm("본인의 관리자 권한을 해제하면 이 화면에 접근할 수 없습니다. 계속할까요?")){render();return}
    try{await updateDoc(doc(db,"users",s.dataset.u),{[s.dataset.k]:s.value})}catch(e){toast("변경 오류: "+e.message)}});
}
