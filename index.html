const NETMSG='서버(API)에 연결하지 못했습니다. ⚙ 설정 → “연결 테스트”로 원인을 확인하세요.';
async function claude(system,user,onDelta){
 const body={model:S.model,max_tokens:700,stream:true,system,messages:[{role:'user',content:user}]};if(useTemp)body.temperature=0;
 const t0=performance.now();let ttft=0,out='';
 const init={method:'POST',headers:H(),body:JSON.stringify(body)};let res;
 for(let a=0;;a++){try{res=await fetch(U('/v1/messages'),init);break}catch{if(a>=1)throw new Error('NET');await new Promise(r=>setTimeout(r,800))}}   // 일시적 모바일 망 끊김은 1회 자동 재시도
 if(!res.ok){const tx=await res.text();if(res.status===400&&useTemp&&/temperature/i.test(tx)){useTemp=false;return claude(system,user,onDelta)}
  throw new Error(res.status===401?'API 키가 올바르지 않습니다':res.status===404?'모델명을 확인하세요':res.status===429?'요청 한도 초과 — 잠시 후 다시 시도':'API 오류 '+res.status)}
 const rd=res.body.getReader(),dec=new TextDecoder();let buf='';
 for(;;){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
  while((i=buf.indexOf('\n\n'))>=0){const ev=buf.slice(0,i);buf=buf.slice(i+2);const d=ev.split('\n').find(l=>l.startsWith('data:'));if(!d)continue;
   try{const j=JSON.parse(d.slice(5));if(j.type==='content_block_delta'&&j.delta&&j.delta.text){if(!ttft)ttft=performance.now()-t0;out+=j.delta.text;if(onDelta)onDelta(out)}}catch{}}}
 return{text:out.trim(),ttft:Math.round(ttft)}}
let useThink=true;
async function gemini(system,user,onDelta){
 const m=S.model,body={systemInstruction:{parts:[{text:system}]},contents:[{role:'user',parts:[{text:user}]}],generationConfig:{maxOutputTokens:700}};
 if(!/gemini-3/.test(m))body.generationConfig.temperature=0;            // Gemini 3 계열은 기본 온도 유지 권장
 if(useThink)body.generationConfig.thinkingConfig={thinkingBudget:0};   // 실시간성: 추론(thinking) 지연 제거
 const t0=performance.now();let ttft=0,out='';
 const init={method:'POST',headers:{'content-type':'application/json','x-goog-api-key':getKey()},body:JSON.stringify(body)},
  url=`${S.base.replace(/\/$/,'')}/v1beta/models/${encodeURIComponent(m)}:streamGenerateContent?alt=sse`;
 let res;for(let a=0;;a++){try{res=await fetch(url,init);break}catch{if(a>=1)throw new Error('NET');await new Promise(r=>setTimeout(r,800))}}
 if(!res.ok){const tx=await res.text();let msg='';try{msg=JSON.parse(tx).error.message||''}catch{}
  if(res.status===400&&useThink&&/think/i.test(msg)){useThink=false;return gemini(system,user,onDelta)}   // 일부 모델은 thinking 끄기 불가 → 자동 재시도
  throw new Error(/API key not valid|API_KEY_INVALID/i.test(msg)?'API 키가 올바르지 않습니다':res.status===403?'API 키 권한 없음/차단됨 — AI Studio에서 키 상태 확인':res.status===404?'모델명을 확인하세요':res.status===429?'사용 한도 초과(무료 등급은 분당 요청 제한) — 잠시 후 다시 시도':res.status>=500?'Google 서버 일시 오류 — 잠시 후 다시 시도':'API 오류 '+res.status+(msg?' · '+msg.slice(0,80):''))}
 const rd=res.body.getReader(),dec=new TextDecoder();let buf='',fin='';
 for(;;){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true}).replace(/\r/g,'');let i;
  while((i=buf.indexOf('\n\n'))>=0){const ev=buf.slice(0,i);buf=buf.slice(i+2);const d=ev.split('\n').find(l=>l.startsWith('data:'));if(!d)continue;
   try{const j=JSON.parse(d.slice(5));if(j.promptFeedback&&j.promptFeedback.blockReason)throw new Error('SAFE:'+j.promptFeedback.blockReason);
    const c=j.candidates&&j.candidates[0];if(c){if(c.finishReason&&c.finishReason!=='STOP'&&c.finishReason!=='MAX_TOKENS')fin=c.finishReason;
     const tx=((c.content&&c.content.parts)||[]).filter(p=>!p.thought).map(p=>p.text||'').join('');if(tx){if(!ttft)ttft=performance.now()-t0;out+=tx;if(onDelta)onDelta(out)}}}
   catch(e){if(/^SAFE:/.test(e.message))throw new Error('Google 안전 필터가 번역을 차단했습니다('+e.message.slice(5)+') — 표현을 바꿔 다시 말씀해 주세요')}}}
 if(!out&&fin)throw new Error('응답이 차단/중단되었습니다('+fin+')');
 if(!out)throw new Error('빈 응답을 받았습니다 — 다시 시도하세요');
 return{text:out.trim(),ttft:Math.round(ttft)}}
const llm=(a,b,c)=>S.prov==='gemini'?gemini(a,b,c):claude(a,b,c);
/* ---------- 화면 ---------- */
const log=$('#log');
function paint(el,t){el.querySelector('.src').textContent=t.src;const g=el.querySelector('.tgt');g.textContent=t.tgt;g.classList.toggle('w',!!t.bad);g.classList.toggle('pend',t.tgt==='…');
 el.querySelector('.wn').textContent=t.warns.length?'⚠ '+t.warns.join(' | '):'';
 el.querySelector('.mt').textContent=(t.time||'')+(t.ms?` · 첫 글자 ${t.ms}ms`:'')+(t.conf!=null?` · 인식 ${Math.round(t.conf*100)}%`:'');
 const rt=el.querySelector('.rt');if(rt)rt.hidden=!t.failed;
 const b=log.scrollHeight-log.scrollTop-log.clientHeight<140;if(b)log.scrollTop=log.scrollHeight;else $('#jump').hidden=false}
const copy=async x=>{try{await navigator.clipboard.writeText(x);toast('복사했습니다')}catch{toast('복사할 수 없습니다')}};
function bubble(t){$('#em')&&$('#em').remove();const sl=t.who==='me'?S.my:S.peer,tl=t.who==='me'?S.peer:S.my;
 const ib=(l,ic,f)=>h('button',{class:'ib','aria-label':l,title:l,onclick:f},ic);
 const el=h('article',{class:'b '+t.who},h('div',{class:'who'},h('span',{},t.who==='me'?'나':'상대'),h('span',{class:'dir'},`${LG[sl][0]} → ${LG[tl][0]}`)),
  h('div',{class:'tgt pend',lang:tl}),h('div',{class:'src',lang:sl}),h('div',{class:'wn',role:'note'}),
  h('div',{class:'meta'},h('span',{class:'mt'}),ib('번역 읽기','🔊',()=>speak(t.tgt,tl)),ib('번역 복사','⧉',()=>copy(t.tgt)),h('button',{class:'ib rt',hidden:true,onclick:()=>interpret(t.who,t.src,t.conf,t,el)},'↻ 다시 시도')));
 log.append(el);return el}
function showLive(who,text){if(!text){liveEl&&liveEl.remove();liveEl=null;return}
 if(!liveEl){$('#em')&&$('#em').remove();liveEl=h('div',{class:'b live '+who});log.append(liveEl)}liveEl.textContent=text;log.scrollTop=log.scrollHeight}
function speak(text,lang){if(!window.speechSynthesis||!text)return;const u=new SpeechSynthesisUtterance(text);u.lang=LG[lang][1];muted=true;u.onend=u.onerror=()=>setTimeout(()=>muted=false,700);speechSynthesis.cancel();speechSynthesis.speak(u)}
async function interpret(who,src,conf,t0,el0){
 src=src.replace(/<\/?\s*(utterance|context|review)[^>]*>/gi,'').trim();if(!src)return;
 const me=who==='me',sl=me?S.my:S.peer,tl=me?S.peer:S.my,pairs=me?G():G().map(([a,b])=>[b,a]);
 const t=t0||{who,src,tgt:'…',warns:[],conf,bad:false,time:new Date().toTimeString().slice(0,8)},el=el0||bubble(t);
 if(t0)Object.assign(t,{tgt:'…',warns:[],bad:false,failed:false});else turns.push(t);
 if(conf!=null&&conf<.5)t.warns.push(`음성인식 신뢰도 낮음(${Math.round(conf*100)}%) — 중요 내용은 재확인`);
 paint(el,t);setState('work');
 try{const system=sysP(sl,tl,pairs),cx=hist.length?'<context>\n'+hist.map(x=>`[${x.w}] ${x.s.slice(0,300)} => ${x.t.slice(0,300)}`).join('\n')+'\n</context>\n':'',
   user=`${cx}<utterance lang="${sl}">\n${src}\n</utterance>`;
  let r=await llm(system,user,x=>{t.tgt=x;paint(el,t)});
  if(r.text==='[unclear]'){t.tgt='[불명확 — 다시 말씀해 주세요]';t.bad=true;t.warns.push('번역 불가로 판단')}
  else{let is=check(src,r.text,pairs,sl,tl);
   if(is.length){t.warns.push('자동 재번역 수행됨');const fb=is.map(x=>'- '+x).join('\n');
    const r2=await llm(system,user+`\n<review>\nPrevious translation: ${r.text}\nAutomatic checker found:\n${fb}\nRetranslate faithfully, fixing these exactly. Output only the translation.\n</review>`).catch(()=>null);
    if(r2&&r2.text){const i2=check(src,r2.text,pairs,sl,tl);if(i2.length<=is.length){r={...r,text:r2.text};is=i2}}}
   t.tgt=r.text;t.ms=r.ttft;t.warns.push(...is);t.bad=is.length>0;
   if(!is.length&&S.my!==S.peer){hist.push({w:me?'나':'상대',s:src,t:r.text});while(hist.length>Math.max(0,+S.ctx||0))hist.shift()}   // 검증 통과한 번역만 문맥에 반영
   if(S.speak&&me&&!is.length)speak(r.text,tl)}
 }catch(e){t.tgt='[번역 실패]';t.bad=t.failed=true;t.warns.push(e.message==='NET'||e.name==='TypeError'?NETMSG:(e.message||'알 수 없는 오류'))}
 setState(t.failed?'err':active?'listen':'idle');paint(el,t)}
/* ---------- 음성인식 ---------- */
const STX={idle:'대기',listen:'● 듣는 중',work:'번역 중…',err:'⚠ 오류'};
function setState(k){const e=$('#st');e.dataset.s=k;e.textContent=STX[k]}
function setMic(w){for(const[id,v]of[['bm','me'],['bp','peer']]){const e=$('#'+id);e.classList.toggle('on',w===v);e.setAttribute('aria-pressed',w===v)}setState(w?'listen':'idle')}
function stopListen(){const r=rec;rec=null;active=null;try{r&&r.stop()}catch{}setMic(null);showLive('',' ');try{wl&&wl.release()}catch{}wl=null}
function listen(who){
 if(active===who)return stopListen();if(active)stopListen();
 if(!SR)return toast('이 브라우저는 음성인식을 지원하지 않습니다. “텍스트로 입력”을 사용하세요.');
 if(!getKey()){toast('먼저 설정에서 API 키를 입력하세요');return openCfg()}
 active=who;setMic(who);try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>wl=l).catch(()=>{})}catch{}
 const start=()=>{if(active!==who)return;const r=rec=new SR();r.lang=LG[who==='me'?S.my:S.peer][1];r.interimResults=true;r.maxAlternatives=1;let fin='',cf=1;
  r.onresult=e=>{if(muted)return;let it='';for(let i=e.resultIndex;i<e.results.length;i++){const x=e.results[i];if(x.isFinal){fin+=x[0].transcript+' ';cf=Math.min(cf,x[0].confidence||1)}else it+=x[0].transcript}showLive(who,fin+it)};
  r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){toast('마이크 권한을 허용해 주세요');stopListen()}};
  r.onend=()=>{showLive('','');if(fin.trim()&&!muted)interpret(who,fin.trim(),cf);if(active===who)setTimeout(start,250)};
  try{r.start()}catch{}};
 start()}
/* ---------- 설정/내보내기 ---------- */
const lab=()=>{$('#lm').textContent=LG[S.my][0];$('#lp').textContent=LG[S.peer][0]};
const fill=()=>{lab();const o=Object.entries(LG).map(([c,v])=>h('option',{value:c},v[0]));for(const[id,k]of[['ml','my'],['pl','peer']]){const s=$('#'+id);s.replaceChildren(...Object.entries(LG).map(([c,v])=>h('option',{value:c,selected:S[k]===c},v[0])))}};
function pvUI(){const p=$('#pv').value,o=p==='gemini'?'claude':'gemini';
 for(const[id,k]of[['bu','base'],['md','model']]){const e=$('#'+id),v=e.value.trim();if(!v||v===DEF[o][k])e.value=DEF[p][k]}
 $('#k').value=keyOf(p);$('#k').placeholder=p==='gemini'?'AIza…':'sk-ant-…';$('#kl').textContent=p==='gemini'?'Google AI Studio API 키':'Anthropic API 키';$('#rk').checked=!!sto(localStorage,KN(p));
 $('#kh').textContent=p==='gemini'?'aistudio.google.com/apikey 에서 발급 · Google Cloud에서 키에 “웹사이트 제한(Referrer)”을 걸어 두세요 · 무료 등급은 입력 내용이 Google 제품 개선에 사용될 수 있으니 업무 기밀은 유료 등급 사용을 권장합니다':'console.anthropic.com 에서 발급';
 $('#ml2').replaceChildren(...DEF[p].list.map(v=>h('option',{value:v})))}
$('#pv').onchange=pvUI;
function openCfg(){$('#pv').value=S.prov;$('#bu').value=S.base;$('#md').value=S.model;$('#tn').value=S.tone;$('#dm').value=S.domain;$('#gl').value=S.gloss;$('#cx').value=S.ctx;$('#sp').checked=S.speak;pvUI();$('#dlg').showModal()}
$('#sv').onclick=e=>{const b=$('#bu').value.trim(),k0=$('#k').value.trim();
 if(!/^https:\/\//.test(b)){e.preventDefault();toast('API 주소는 https:// 로 시작해야 합니다');return}
 if(k0&&!/^[\x21-\x7e]+$/.test(k0)){e.preventDefault();toast('API 키에 공백·한글·특수문자가 섞여 있습니다. 다시 붙여넣어 주세요');return}
 Object.assign(S,{prov:$('#pv').value,base:b,model:$('#md').value.trim()||DEF[$('#pv').value].model,tone:$('#tn').value,domain:$('#dm').value.trim()||'General business meeting',gloss:$('#gl').value,ctx:+$('#cx').value||0,speak:$('#sp').checked});saveS();
 const k=$('#k').value.trim(),P=S.prov;sto(sessionStorage,KN(P),null);sto(localStorage,KN(P),null);if(k)sto($('#rk').checked?localStorage:sessionStorage,KN(P),k);useTemp=useThink=true;toast('저장됨');emOk()};
$('#ck').onclick=()=>{const P=$('#pv').value;sto(sessionStorage,KN(P),null);sto(localStorage,KN(P),null);$('#k').value='';toast('API 키를 삭제했습니다')};
$('#cl').onclick=()=>{if(!confirm('화면의 대화와 문맥을 모두 지울까요?'))return;turns=[];hist=[];log.replaceChildren();toast('대화를 지웠습니다')};
async function exportTxt(){if(!turns.length)return toast('내보낼 대화가 없습니다');
 const tx=turns.map(t=>`[${t.time}] ${t.who==='me'?'나':'상대'}\n  원문: ${t.src}\n  번역: ${t.tgt}${t.warns.length?'\n  ⚠ '+t.warns.join(' | '):''}`).join('\n\n');
 const f=new File([tx],`통역기록_${new Date().toISOString().slice(0,16).replace(/[-:T]/g,'')}.txt`,{type:'text/plain'});
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{return await navigator.share({files:[f]})}catch(e){if(e.name==='AbortError')return}}
 const a=h('a',{href:URL.createObjectURL(f),download:f.name});document.body.append(a);a.click();a.remove()}
async function diag(){$('#dgo').textContent='확인 중…';const o=[],p=$('#pv').value,g=p==='gemini',b=($('#bu').value.trim()||DEF[p].base).replace(/\/$/,''),k=$('#k').value.trim()||keyOf(p),m=encodeURIComponent($('#md').value.trim()||DEF[p].model);
 o.push(navigator.onLine?'✔ 인터넷 연결됨':'✘ 오프라인 상태입니다');
 try{const t0=performance.now(),r=await fetch(g?`${b}/v1beta/models/${m}`:`${b}/v1/models/${m}`,{headers:g?{'x-goog-api-key':k||'none'}:{'x-api-key':k||'none','anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}});
  o.push(`✔ 서버 연결 정상 (${Math.round(performance.now()-t0)}ms)`);
  o.push(r.status===200?'✔ API 키·모델 정상':[400,401,403].includes(r.status)?'✘ API 키가 올바르지 않거나 권한이 없습니다':r.status===404?'✘ 모델명을 찾을 수 없습니다 (설정의 번역 모델 확인)':'ℹ 서버 응답 '+r.status)}
 catch{o.push('✘ 서버에 연결하지 못했습니다','원인 후보: ① 회사·학교 방화벽/VPN/프록시가 API 도메인 차단 ② 콘텐츠 차단 앱·광고 차단 확장프로그램 ③ 잘못된 API 주소','조치: Wi-Fi를 끄고 모바일 데이터로 시험 / 시크릿 창에서 시험 / 사내 게이트웨이 주소를 “API 주소”에 입력')}
 const d=$('#dgo');d.textContent='';o.forEach(x=>d.append(h('div',{class:x[0]==='✔'?'ok':x[0]==='✘'?'ng':''},x)))}
$('#dg').onclick=diag;
fill();
$('#ml').onchange=e=>{S.my=e.target.value;saveS();lab()};$('#pl').onchange=e=>{S.peer=e.target.value;saveS();lab()};
$('#sw').onclick=()=>{[S.my,S.peer]=[S.peer,S.my];saveS();fill();hist=[]};
$('#bm').onclick=()=>listen('me');$('#bp').onclick=()=>listen('peer');$('#cfg').onclick=openCfg;$('#exp').onclick=exportTxt;
const typed=w=>{const i=$('#ti'),v=i.value.trim();if(!v)return;if(!getKey()){toast('먼저 설정에서 API 키를 입력하세요');return openCfg()}i.value='';interpret(w,v,null)};
$('#tm').onclick=()=>typed('me');$('#tp').onclick=()=>typed('peer');$('#ti').addEventListener('keydown',e=>{if(e.key==='Enter')typed('me')});
const emOk=()=>{const l=document.querySelector('#em li[data-s=k]');l&&l.classList.toggle('ok',!!getKey())};emOk();
const e1=$('#e1');if(e1)e1.onclick=openCfg;
const fs=()=>document.documentElement.style.setProperty('--fs',S.fs+'px');fs();
$('#fm').onclick=()=>{S.fs=Math.max(15,S.fs-2);saveS();fs()};$('#fp').onclick=()=>{S.fs=Math.min(34,S.fs+2);saveS();fs()};
$('#jump').onclick=()=>{log.scrollTop=log.scrollHeight;$('#jump').hidden=true};
log.addEventListener('scroll',()=>{if(log.scrollHeight-log.scrollTop-log.clientHeight<140)$('#jump').hidden=true});
if(!SR){$('#ban').hidden=false;$('#ban').textContent='이 브라우저는 음성인식을 지원하지 않습니다(Chrome/Safari 권장). “텍스트로 입력”을 사용하세요.';document.querySelector('details').open=true}
