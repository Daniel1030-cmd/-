<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>서버사업 고객관리시스템 (CRM)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy:        #0B1426;
  --navy-mid:    #0F1E35;
  --indigo:      #1E3A5F;
  --brand:       #2563EB;
  --brand-light: #3B82F6;
  --brand-dim:   #1D4ED8;
  --cyan:        #0EA5E9;
  --emerald:     #059669;
  --amber:       #D97706;
  --rose:        #E11D48;
  --violet:      #7C3AED;
  --teal:        #0D9488;
  --slate-50:    #F8FAFC;
  --slate-100:   #F1F5F9;
  --slate-200:   #E2E8F0;
  --slate-300:   #CBD5E1;
  --slate-400:   #94A3B8;
  --slate-500:   #64748B;
  --slate-600:   #475569;
  --slate-700:   #334155;
  --slate-800:   #1E293B;
  --slate-900:   #0F172A;
  --white:       #FFFFFF;
  --radius-sm:   6px;
  --radius-md:   10px;
  --radius-lg:   16px;
  --shadow-sm:   0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md:   0 4px 12px rgba(0,0,0,.08), 0 2px 6px rgba(0,0,0,.05);
  --shadow-lg:   0 10px 30px rgba(0,0,0,.12), 0 4px 12px rgba(0,0,0,.06);
  --sidebar-w:   260px;
  --header-h:    64px;
  --font-base:   'Inter','Noto Sans KR',system-ui,sans-serif;
  --transition:  0.18s cubic-bezier(0.4,0,0.2,1);
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--slate-50);
  font-family: var(--font-base);
  font-size: 14px;
  color: var(--slate-700);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--slate-300); border-radius: 99px; }

/* LOGIN */
.login-screen {
  position: fixed; inset: 0;
  background: linear-gradient(135deg, var(--navy) 0%, var(--indigo) 100%);
  display: flex; align-items: center; justify-content: center;
  z-index: 2000; padding: 20px;
}
.login-screen::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse 60% 60% at 70% 30%, rgba(37,99,235,.18) 0%, transparent 70%);
  pointer-events: none;
}
.login-box {
  background: var(--white); border-radius: var(--radius-lg);
  padding: 40px 36px; width: 400px; max-width: 100%;
  box-shadow: 0 24px 64px rgba(0,0,0,.35); position: relative;
}
.login-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
.login-logo-icon {
  width: 40px; height: 40px;
  background: linear-gradient(135deg, var(--brand), var(--cyan));
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center; font-size: 20px;
}
.login-logo-text { font-size: 15px; font-weight: 700; color: var(--slate-900); letter-spacing: -0.3px; }
.login-logo-sub  { font-size: 11px; color: var(--slate-400); font-weight: 400; margin-top: 1px; }
.login-box h2    { font-size: 22px; font-weight: 700; color: var(--slate-900); margin-bottom: 4px; letter-spacing: -0.4px; }
.login-box p     { font-size: 13px; color: var(--slate-500); margin-bottom: 24px; }
.login-error {
  color: var(--rose); font-size: 12px; margin-top: 10px;
  background: rgba(225,29,72,.06); border-radius: var(--radius-sm);
  padding: 8px 10px; display: none;
}

/* HEADER */
.header {
  position: fixed; top: 0; left: 0; right: 0;
  height: var(--header-h); background: var(--navy);
  border-bottom: 1px solid rgba(255,255,255,.06);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px 0 16px; z-index: 900;
  box-shadow: 0 2px 12px rgba(0,0,0,.2);
}
.header-left  { display: flex; align-items: center; gap: 12px; }
.header-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.header-icon {
  width: 34px; height: 34px;
  background: linear-gradient(135deg, var(--brand), var(--cyan));
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0;
}
.header-title    { font-size: 15px; font-weight: 700; color: var(--white); letter-spacing: -0.3px; line-height: 1.2; white-space: nowrap; }
.header-subtitle { font-size: 10px; color: rgba(255,255,255,.4); font-weight: 400; }
.header-right    { display: flex; align-items: center; gap: 10px; }
.header-user     { font-size: 12px; color: rgba(255,255,255,.55); max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu-toggle {
  display: none; background: none; border: none; color: rgba(255,255,255,.7);
  font-size: 20px; cursor: pointer; padding: 6px; border-radius: var(--radius-sm);
  transition: background var(--transition);
}
.menu-toggle:hover { background: rgba(255,255,255,.1); }

/* LAYOUT */
.layout { display: flex; padding-top: var(--header-h); min-height: 100vh; }

/* SIDEBAR */
.sidebar {
  width: var(--sidebar-w); background: var(--navy-mid); flex-shrink: 0;
  position: fixed; top: var(--header-h); left: 0; bottom: 0;
  overflow-y: auto; border-right: 1px solid rgba(255,255,255,.05);
  z-index: 800; display: flex; flex-direction: column;
  transition: transform var(--transition);
}
.sidebar-section-label {
  font-size: 10px; font-weight: 600; letter-spacing: 1.2px;
  color: rgba(255,255,255,.3); text-transform: uppercase;
  padding: 20px 18px 8px;
}
.sidebar-nav { list-style: none; padding: 0 10px; }
.sidebar-nav li { margin-bottom: 2px; }
.sidebar-nav li a {
  display: flex; align-items: center; gap: 11px;
  padding: 10px 12px; border-radius: var(--radius-md);
  color: rgba(255,255,255,.55); text-decoration: none;
  font-size: 13.5px; font-weight: 500; cursor: pointer;
  transition: all var(--transition); position: relative;
}
.sidebar-nav li a:hover { background: rgba(255,255,255,.07); color: rgba(255,255,255,.9); }
.sidebar-nav li a.active {
  background: linear-gradient(90deg, rgba(37,99,235,.35), rgba(37,99,235,.15));
  color: var(--white); box-shadow: inset 3px 0 0 var(--brand);
}
.sidebar-nav li a .nav-icon { font-size: 16px; width: 22px; text-align: center; flex-shrink: 0; }
.sidebar-nav li a .nav-badge {
  margin-left: auto; background: var(--brand); color: var(--white);
  font-size: 10px; font-weight: 700; border-radius: 99px;
  padding: 1px 7px; min-width: 20px; text-align: center;
}
.sidebar-footer { margin-top: auto; padding: 16px 18px; border-top: 1px solid rgba(255,255,255,.06); font-size: 11px; color: rgba(255,255,255,.25); }
.sidebar-backdrop {
  display: none; position: fixed; top: var(--header-h); left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,.5); z-index: 790; backdrop-filter: blur(2px);
}

/* CONTENT */
.content { flex: 1; margin-left: var(--sidebar-w); padding: 28px 28px 40px; min-width: 0; min-height: calc(100vh - var(--header-h)); }
.page-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 24px; gap: 16px; flex-wrap: wrap; }
.page-title   { font-size: 22px; font-weight: 700; color: var(--slate-900); letter-spacing: -0.5px; line-height: 1.2; }
.page-subtitle { font-size: 12px; color: var(--slate-400); margin-top: 4px; font-weight: 400; }

/* STAT CARDS */
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
.stat-card {
  background: var(--white); border-radius: var(--radius-lg);
  padding: 20px; box-shadow: var(--shadow-sm); border: 1px solid var(--slate-200);
  position: relative; overflow: hidden; transition: transform var(--transition), box-shadow var(--transition);
}
.stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.stat-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; border-radius: 4px 0 0 4px; }
.stat-card:nth-child(1)::before { background: var(--brand); }
.stat-card:nth-child(2)::before { background: var(--cyan); }
.stat-card:nth-child(3)::before { background: var(--violet); }
.stat-card:nth-child(4)::before { background: var(--emerald); }
.stat-label { font-size: 11px; font-weight: 600; letter-spacing: 0.5px; color: var(--slate-400); text-transform: uppercase; }
.stat-value { font-size: 36px; font-weight: 700; color: var(--slate-900); line-height: 1.1; margin-top: 8px; letter-spacing: -1px; }
.stat-icon  { position: absolute; right: 16px; top: 16px; font-size: 28px; opacity: .12; }

/* PANEL */
.panel { background: var(--white); border-radius: var(--radius-lg); border: 1px solid var(--slate-200); box-shadow: var(--shadow-sm); overflow: hidden; margin-bottom: 20px; }
.panel-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; border-bottom: 1px solid var(--slate-100); flex-wrap: wrap; gap: 12px; }
.panel-title  { font-size: 15px; font-weight: 700; color: var(--slate-900); letter-spacing: -0.3px; }
.panel-body   { padding: 0; overflow-x: auto; }
.panel-inner  { padding: 20px 22px; }

/* TOOLBAR / FILTER */
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.filter-row { padding: 14px 22px; border-bottom: 1px solid var(--slate-100); display: flex; gap: 10px; flex-wrap: wrap; }
.filter-input {
  flex: 1; min-width: 200px; padding: 8px 12px;
  border: 1px solid var(--slate-200); border-radius: var(--radius-md);
  font-size: 13px; font-family: var(--font-base);
  background: var(--slate-50); color: var(--slate-700);
  transition: border-color var(--transition), box-shadow var(--transition);
}
.filter-input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(37,99,235,.12); background: var(--white); }

/* BUTTONS */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px 16px; border: none; border-radius: var(--radius-md);
  font-size: 13px; font-weight: 600; font-family: var(--font-base);
  cursor: pointer; transition: all var(--transition); white-space: nowrap; line-height: 1;
}
.btn-primary   { background: var(--brand); color: var(--white); box-shadow: 0 1px 4px rgba(37,99,235,.3); }
.btn-primary:hover { background: var(--brand-dim); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(37,99,235,.35); }
.btn-secondary { background: var(--slate-100); color: var(--slate-600); border: 1px solid var(--slate-200); }
.btn-secondary:hover { background: var(--slate-200); color: var(--slate-800); }
.btn-danger    { background: rgba(225,29,72,.1); color: var(--rose); border: 1px solid rgba(225,29,72,.2); }
.btn-danger:hover  { background: var(--rose); color: var(--white); }
.btn-success   { background: rgba(5,150,105,.1); color: var(--emerald); border: 1px solid rgba(5,150,105,.2); }
.btn-success:hover { background: var(--emerald); color: var(--white); }
.btn-ghost     { background: transparent; color: var(--slate-500); border: 1px solid var(--slate-200); }
.btn-ghost:hover   { background: var(--slate-100); }
.btn-sm  { padding: 6px 11px; font-size: 12px; border-radius: var(--radius-sm); }
.btn-xs  { padding: 4px 8px; font-size: 11px; border-radius: 4px; }
.btn-icon { padding: 7px; border-radius: var(--radius-sm); background: var(--slate-100); color: var(--slate-500); border: none; cursor: pointer; font-size: 14px; transition: all var(--transition); }
.btn-icon:hover { background: var(--slate-200); color: var(--slate-700); }

/* TABLE */
table { width: 100%; border-collapse: collapse; min-width: 500px; }
thead tr { background: var(--slate-50); }
th { padding: 11px 14px; font-size: 11px; font-weight: 600; letter-spacing: 0.5px; color: var(--slate-400); text-transform: uppercase; text-align: left; border-bottom: 1px solid var(--slate-200); white-space: nowrap; }
td { padding: 13px 14px; font-size: 13px; color: var(--slate-600); border-bottom: 1px solid var(--slate-100); vertical-align: middle; }
tbody tr { transition: background var(--transition); }
tbody tr:hover { background: var(--slate-50); }
tbody tr:last-child td { border-bottom: none; }
td.center { text-align: center; }
td.actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.cell-name { font-weight: 600; color: var(--slate-800); }
.cell-sub  { font-size: 11px; color: var(--slate-400); margin-top: 2px; }
.empty-row td { text-align: center; padding: 44px 14px; color: var(--slate-400); font-size: 13px; }
.empty-icon   { font-size: 32px; display: block; margin-bottom: 10px; opacity: .4; }

/* BADGES */
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 99px; font-size: 11px; font-weight: 700; letter-spacing: 0.3px; white-space: nowrap; }
.badge::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .7; flex-shrink: 0; }
.badge-scheduled { background: rgba(124,58,237,.12); color: var(--violet); }
.badge-done      { background: rgba(99,102,241,.12); color: #4F46E5; }
.badge-passed    { background: rgba(5,150,105,.12); color: var(--emerald); }
.badge-failed    { background: rgba(225,29,72,.1); color: var(--rose); }
.badge-active    { background: rgba(37,99,235,.12); color: var(--brand); }
.badge-closed    { background: rgba(100,116,139,.1); color: var(--slate-500); }
.badge-eval      { background: rgba(13,148,136,.12); color: var(--teal); }
.badge-eval-done { background: rgba(5,150,105,.15); color: var(--emerald); cursor: pointer; }
.badge-eval-done:hover { background: rgba(5,150,105,.28); }
.badge-contract  { background: rgba(5,150,105,.12); color: var(--emerald); }

/* MODAL */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(15,23,42,.55);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000; padding: 20px; backdrop-filter: blur(3px);
  animation: fadeIn .15s ease;
}
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
.modal {
  background: var(--white); border-radius: var(--radius-lg);
  width: 500px; max-width: 100%; max-height: 90vh; overflow-y: auto;
  box-shadow: var(--shadow-lg); animation: slideUp .2s cubic-bezier(0.34,1.56,0.64,1);
}
.modal-wide {
  width: 720px;
}
@keyframes slideUp { from { transform: translateY(20px); opacity:0; } to { transform: translateY(0); opacity:1; } }
.modal-head { padding: 22px 24px 0; display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.modal-title { font-size: 17px; font-weight: 700; color: var(--slate-900); letter-spacing: -0.4px; }
.modal-close { background: none; border: none; color: var(--slate-400); font-size: 18px; cursor: pointer; padding: 4px; border-radius: var(--radius-sm); transition: all var(--transition); }
.modal-close:hover { background: var(--slate-100); color: var(--slate-700); }
.modal-body   { padding: 0 24px; }
.modal-footer { padding: 20px 24px 24px; display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid var(--slate-100); margin-top: 20px; }

/* EVALUATION PREVIEW MODAL */
.eval-modal-preview {
  background: var(--navy);
  border-radius: var(--radius-md);
  padding: 22px;
  color: rgba(255,255,255,.88);
  font-size: 13px;
  line-height: 1.85;
  white-space: pre-wrap;
  font-family: 'Noto Sans KR', monospace;
  max-height: 60vh;
  overflow-y: auto;
  margin-bottom: 16px;
}
.eval-modal-meta { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.eval-modal-meta .badge { font-size: 12px; padding: 4px 12px; }

/* FORM */
.form-group { margin-bottom: 15px; }
.form-group label { display: block; margin-bottom: 5px; font-size: 12px; font-weight: 600; letter-spacing: 0.3px; color: var(--slate-600); text-transform: uppercase; }
.form-control { width: 100%; padding: 9px 12px; border: 1px solid var(--slate-200); border-radius: var(--radius-md); font-size: 14px; font-family: var(--font-base); color: var(--slate-800); background: var(--white); transition: border-color var(--transition), box-shadow var(--transition); }
.form-control:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
.form-control[readonly] { background: var(--slate-50); color: var(--slate-500); }
.form-hint { font-size: 11px; color: var(--slate-400); margin-top: 5px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.resume-tag { display: inline-flex; align-items: center; gap: 8px; background: rgba(37,99,235,.07); border: 1px solid rgba(37,99,235,.2); border-radius: var(--radius-sm); padding: 7px 12px; margin-top: 8px; font-size: 12px; color: var(--brand); }
.resume-tag a { color: var(--brand); text-decoration: none; font-weight: 600; }
.resume-tag a:hover { text-decoration: underline; }

/* 상담기록서 */
.eval-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.eval-section { border: 1px solid var(--slate-200); border-radius: var(--radius-md); margin-bottom: 14px; overflow: hidden; }
.eval-section-header { background: var(--slate-50); padding: 10px 14px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--slate-200); }
.eval-section-num { width: 22px; height: 22px; background: var(--brand); color: var(--white); border-radius: 50%; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.eval-section-title { font-size: 13px; font-weight: 700; color: var(--slate-800); flex: 1; }
.eval-section-body  { padding: 14px; }
.eval-score-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.eval-score-label { font-size: 12px; color: var(--slate-500); min-width: 60px; }
.score-btn-group  { display: flex; gap: 4px; flex-wrap: wrap; }
.score-btn { padding: 4px 10px; border-radius: 99px; border: 1.5px solid var(--slate-300); background: transparent; font-size: 12px; font-weight: 600; color: var(--slate-500); cursor: pointer; transition: all var(--transition); }
.score-btn:hover   { border-color: var(--brand); color: var(--brand); background: rgba(37,99,235,.06); }
.score-btn.selected { background: var(--brand); border-color: var(--brand); color: var(--white); }
.score-btn.A.selected { background: var(--emerald); border-color: var(--emerald); }
.score-btn.B.selected { background: var(--teal); border-color: var(--teal); }
.score-btn.C.selected { background: var(--amber); border-color: var(--amber); }
.score-btn.D.selected { background: var(--rose); border-color: var(--rose); }
.eval-add-btn { width: 100%; padding: 10px; border: 1.5px dashed var(--slate-300); background: transparent; border-radius: var(--radius-md); color: var(--slate-400); cursor: pointer; font-size: 13px; font-family: var(--font-base); transition: all var(--transition); margin-bottom: 14px; }
.eval-add-btn:hover { border-color: var(--brand); color: var(--brand); background: rgba(37,99,235,.04); }
.eval-preview-panel { background: var(--navy); border-radius: var(--radius-lg); padding: 22px; color: rgba(255,255,255,.85); font-size: 12.5px; line-height: 1.8; white-space: pre-wrap; min-height: 400px; font-family: 'Noto Sans KR', monospace; position: sticky; top: 20px; overflow-x: hidden; }
.eval-preview-label { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: rgba(255,255,255,.3); text-transform: uppercase; margin-bottom: 14px; }
.eval-preview-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.eval-candidate-info { display: flex; align-items: center; gap: 14px; background: var(--slate-50); border: 1px solid var(--slate-200); border-radius: var(--radius-md); padding: 14px 18px; margin-bottom: 22px; }
.eval-avatar { width: 44px; height: 44px; background: linear-gradient(135deg, var(--brand), var(--cyan)); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.eval-candidate-name { font-size: 16px; font-weight: 700; color: var(--slate-900); }
.eval-candidate-meta { font-size: 12px; color: var(--slate-500); margin-top: 3px; }
.eval-summary-block { background: var(--slate-50); border: 1px solid var(--slate-200); border-radius: var(--radius-md); padding: 14px; margin-bottom: 14px; }
.eval-summary-title { font-size: 12px; font-weight: 700; color: var(--slate-700); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
.total-score-display { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: var(--radius-md); background: var(--white); border: 1px solid var(--slate-200); margin-bottom: 10px; }
.total-score-value { font-size: 28px; font-weight: 800; color: var(--brand); letter-spacing: -1px; }
.total-score-label { font-size: 12px; color: var(--slate-500); }
.rec-btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
.rec-btn { flex: 1; min-width: 80px; padding: 10px 14px; border-radius: var(--radius-md); border: 1.5px solid var(--slate-300); background: transparent; font-size: 13px; font-weight: 700; cursor: pointer; transition: all var(--transition); color: var(--slate-500); font-family: var(--font-base); text-align: center; }
.rec-btn:hover { border-color: var(--brand); background: rgba(37,99,235,.05); color: var(--brand); }

  const isAndroid = /Android/i.test(ua);
  const iosVerMatch =
    ua.match(/OS (\d+)[_\d]+ like Mac OS/i) ||
    ua.match(/CPU iPhone OS (\d+)/i);
  const iosVersion = isIOS && iosVerMatch ? parseInt(iosVerMatch[1], 10) : 0;
  const isWKWebView =
    isIOS && (
      !/Safari/i.test(ua) ||
      /KAKAO|NAVER|Line|Instagram|FB_IAB/i.test(ua) ||
      !!(window.webkit?.messageHandlers)
    );
  const isSamsung = /SamsungBrowser/i.test(ua);
  const isMobile = isIOS || isAndroid;
  const hasWebShare = "share" in navigator;
  const hasWebShareFiles = hasWebShare && "canShare" in navigator;
  return { isIOS, isAndroid, iosVersion, isWKWebView, isSamsung, isMobile, hasWebShare, hasWebShareFiles };
})();

const PDFJS_VERSION = "5.4.149";
const PDFJS_BASE = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VERSION}/`;
let _pdfjsLibPromise = null;
function loadPdfJs() {
  if (!_pdfjsLibPromise) {
    _pdfjsLibPromise = import(/* @vite-ignore */ PDFJS_BASE + "pdf.min.mjs")
      .then(mod => {
        mod.GlobalWorkerOptions.workerSrc = PDFJS_BASE + "pdf.worker.min.mjs";
        return mod;
      })
      .catch(err => { _pdfjsLibPromise = null; throw err; });
  }
  return _pdfjsLibPromise;
}

function dataUrlToBlob(dataUrl, fallbackMime = "application/octet-stream") {
  const commaIdx = dataUrl.indexOf(",");
  if (commaIdx === -1) throw new Error("잘못된 dataURL 형식입니다.");
  const header = dataUrl.slice(0, commaIdx);
  const b64    = dataUrl.slice(commaIdx + 1);
  const mime   = header.match(/:(.*?);/)?.[1] || fallbackMime;
  const CHUNK = 8192;
  const raw   = atob(b64);
  const len   = raw.length;
  const buffers = [];
  for (let i = 0; i < len; i += CHUNK) {
    const end  = Math.min(i + CHUNK, len);
    const view = new Uint8Array(end - i);
    for (let j = i; j < end; j++) view[j - i] = raw.charCodeAt(j);
    buffers.push(view);
  }
  return { blob: new Blob(buffers, { type: mime }), mime };
}

function makeBlobUrl(blob, ttlMs = 180_000) {
  const url = URL.createObjectURL(blob);
  setTimeout(() => URL.revokeObjectURL(url), ttlMs);
  return url;
}

let _scrollY = 0;
function lockBodyScroll() {
  _scrollY = window.scrollY;
  document.body.style.overflow   = "hidden";
  if (ENV.isIOS) {
    document.body.style.position = "fixed";
    document.body.style.top      = `-${_scrollY}px`;
    document.body.style.width    = "100%";
    document.body.style.left     = "0";
  }
}
function unlockBodyScroll() {
  document.body.style.overflow = "";
  if (ENV.isIOS) {
    document.body.style.position = "";
    document.body.style.top      = "";
    document.body.style.width    = "";
    document.body.style.left     = "";
    window.scrollTo({ top: _scrollY, behavior: "instant" });
  }
}

async function shareFile(blob, mime, fileName) {
  if (!ENV.hasWebShare) return false;
  try {
    if (ENV.hasWebShareFiles) {
      const file = new File([blob], fileName, { type: mime });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: fileName });
        return true;
      }
    }
    const blobUrl = makeBlobUrl(blob, 30_000);
    await navigator.share({ url: blobUrl, title: fileName });
    return true;
  } catch (err) {
    if (err.name === "AbortError") return true;
    console.warn("[WebShare] 실패:", err.name, err.message);
    return false;
  }
}

function downloadBlob(blob, fileName) {
  const ttl = ENV.isSamsung ? 30_000 : 10_000;
  const url  = makeBlobUrl(blob, ttl);
  const a    = Object.assign(document.createElement("a"), {
    href: url, download: fileName || "attachment", style: "display:none"
  });
  document.body.appendChild(a);
  a.click();
  requestAnimationFrame(() => { try { document.body.removeChild(a); } catch {} });
}

function openNewTab(blob, mime, fileName) {
  const blobUrl = makeBlobUrl(blob, 90_000);
  const w = window.open("", "_blank");
  if (!w) { downloadBlob(blob, fileName); return; }
  const safeTitle = fileName ? fileName.replace(/</g,"&lt;") : "첨부파일";
  if (mime === "application/pdf") {
    w.document.write(`<!DOCTYPE html><html lang="ko"><head>
      <meta charset="UTF-8"><title>${safeTitle}</title>
      <style>*{margin:0;padding:0;box-sizing:border-box;}html,body{height:100%;background:#404040;}
      object{display:block;width:100%;height:100%;border:none;}</style></head><body>
      <object data="${blobUrl}" type="application/pdf">
        <p style="color:#fff;padding:24px;text-align:center;font-family:sans-serif;">
          PDF를 표시할 수 없습니다.
          <a href="${blobUrl}" download="${safeTitle}"
             style="color:#60A5FA;display:block;margin-top:12px;">다운로드</a>
        </p>
      </object></body></html>`);
  } else if (mime.startsWith("image/")) {
    w.document.write(`<!DOCTYPE html><html lang="ko"><head>
      <meta charset="UTF-8"><title>${safeTitle}</title>
      <style>*{margin:0;padding:0;}body{background:#1a1a1a;display:flex;align-items:center;
      justify-content:center;min-height:100vh;}
      img{max-width:98vw;max-height:98vh;object-fit:contain;
          box-shadow:0 4px 32px rgba(0,0,0,.7);}</style></head><body>
      <img src="${blobUrl}" alt="${safeTitle}"></body></html>`);
  } else {
    w.close();
    downloadBlob(blob, fileName);
    return;
  }
  w.document.close();
}

function createZoomController(bodyEl, transformWrapEl, zoomLabelEl) {
  const MIN_SCALE = 0.5;
  const MAX_SCALE = 4.0;
  const STEP      = 0.25;

  let scale      = 1.0;
  let translateX = 0;
  let translateY = 0;

  let isPanning    = false;
  let panStartX    = 0;
  let panStartY    = 0;
  let panOriginTX  = 0;
  let panOriginTY  = 0;

  let isPinching    = false;
  let pinchStartDist = 0;
  let pinchStartScale = 1;
  let pinchMidX    = 0;
  let pinchMidY    = 0;
  let pinchOriginTX = 0;
  let pinchOriginTY = 0;

  let lastTapTime = 0;
  let lastTapX    = 0;
  let lastTapY    = 0;

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function applyTransform(animate = false) {
    if (animate) {
      transformWrapEl.classList.add("animated");
      setTimeout(() => transformWrapEl.classList.remove("animated"), 220);
    }
    transformWrapEl.style.transform = `scale(${scale}) translate(${translateX}px, ${translateY}px)`;
    if (zoomLabelEl) zoomLabelEl.textContent = Math.round(scale * 100) + "%";
  }

  function clampTranslate() {
    if (scale <= 1.0) {
      translateX = 0;
      translateY = 0;
      return;
    }
    const wrapW = transformWrapEl.offsetWidth  || window.innerWidth;
    const wrapH = transformWrapEl.scrollHeight || window.innerHeight;
    const maxTX = (wrapW  * (scale - 1)) / (2 * scale);
    const maxTY = (wrapH  * (scale - 1)) / (2 * scale);
    translateX = clamp(translateX, -maxTX, maxTX);
    translateY = clamp(translateY, -maxTY, maxTY);
  }

  function zoomIn()    { scale = clamp(scale + STEP, MIN_SCALE, MAX_SCALE); clampTranslate(); applyTransform(true); }
  function zoomOut()   { scale = clamp(scale - STEP, MIN_SCALE, MAX_SCALE); clampTranslate(); applyTransform(true); }
  function zoomReset() { scale = 1.0; translateX = 0; translateY = 0; applyTransform(true); }

  function getTouchDist(t1, t2) {
    return Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
  }
  function getTouchMid(t1, t2, container) {
    const rect = container.getBoundingClientRect();
    return {
      x: (t1.clientX + t2.clientX) / 2 - rect.left,
      y: (t1.clientY + t2.clientY) / 2 - rect.top
    };
  }

  bodyEl.addEventListener("touchstart", onTouchStart, { passive: false });
  bodyEl.addEventListener("touchmove",  onTouchMove,  { passive: false });
  bodyEl.addEventListener("touchend",   onTouchEnd,   { passive: false });

  function onTouchStart(e) {
    if (e.touches.length === 2) {
      isPinching = true;
      isPanning  = false;
      pinchStartDist  = getTouchDist(e.touches[0], e.touches[1]);
      pinchStartScale = scale;
      const mid = getTouchMid(e.touches[0], e.touches[1], bodyEl);
      pinchMidX = mid.x;
      pinchMidY = mid.y;
      pinchOriginTX = translateX;
      pinchOriginTY = translateY;
      e.preventDefault();
    } else if (e.touches.length === 1) {
      const now = Date.now();
      const tx  = e.touches[0].clientX;
      const ty  = e.touches[0].clientY;
      if (now - lastTapTime < 300 && Math.abs(tx - lastTapX) < 30 && Math.abs(ty - lastTapY) < 30) {
        if (scale > 1.0) {
          zoomReset();
        } else {
          scale = 2.0;
          clampTranslate();
          applyTransform(true);
        }
        lastTapTime = 0;
        e.preventDefault();
        return;
      }
      lastTapTime = now;
      lastTapX    = tx;
      lastTapY    = ty;

      if (scale > 1.01) {
        isPanning   = true;
        panStartX   = e.touches[0].clientX;
        panStartY   = e.touches[0].clientY;
        panOriginTX = translateX;
        panOriginTY = translateY;
      }
    }
  }

  function onTouchMove(e) {
    if (e.touches.length === 2 && isPinching) {
      const dist     = getTouchDist(e.touches[0], e.touches[1]);
      const newScale = clamp(pinchStartScale * (dist / pinchStartDist), MIN_SCALE, MAX_SCALE);
      scale = newScale;
      clampTranslate();
      applyTransform(false);
      e.preventDefault();
    } else if (e.touches.length === 1 && isPanning && scale > 1.01) {
      const dx = (e.touches[0].clientX - panStartX) / scale;
      const dy = (e.touches[0].clientY - panStartY) / scale;
      translateX = panOriginTX + dx;
      translateY = panOriginTY + dy;
      clampTranslate();
      applyTransform(false);
      e.preventDefault();
    }
  }

  function onTouchEnd(e) {
    if (e.touches.length < 2) isPinching = false;
    if (e.touches.length === 0) {
      isPanning = false;
      if (scale <= 1.0) { translateX = 0; translateY = 0; applyTransform(false); }
    }
  }

  return { zoomIn, zoomOut, zoomReset };
}

function openInlineViewer(blob, mime, fileName, rawDataUrl) {
  document.getElementById("rv-overlay")?.remove();

  const isPdf = mime === "application/pdf";
  const isImg = mime.startsWith("image/");

  const handleSave = async () => {
    if (ENV.isIOS) {
      const ok = await shareFile(blob, mime, fileName);
      if (!ok) {
        alert("저장하려면:\n[공유 버튼] → [파일에 저장] 또는 [이미지 저장]을 선택하세요.\n\n저장이 안 되면 PC에서 다운로드해 주세요.");
      }
    } else {
      downloadBlob(blob, fileName);
    }
  };

  const overlay = document.createElement("div");
  overlay.id = "rv-overlay";
  overlay.setAttribute("role", "dialog");
  overlay.setAttribute("aria-modal", "true");
  overlay.setAttribute("aria-label", "첨부파일 뷰어");

  const showZoomBar = isPdf || isImg;

  overlay.innerHTML = `
    <div id="rv-toolbar">
      <span id="rv-filename">📎 ${fileName || "첨부파일"}</span>
      <div id="rv-btns">
        <button class="rv-btn rv-btn-save" id="rv-save-btn">
          ${ENV.isIOS ? "📤 저장" : "💾 저장"}
        </button>
        <button class="rv-btn rv-btn-close" id="rv-close-btn" aria-label="닫기">✕ 닫기</button>
      </div>
    </div>
    ${showZoomBar ? `
    <div id="rv-zoom-bar">
      <button class="rv-zoom-btn" id="rv-zoom-out" aria-label="축소">−</button>
      <span id="rv-zoom-label">100%</span>
      <button class="rv-zoom-btn" id="rv-zoom-in" aria-label="확대">+</button>
      <button id="rv-zoom-reset">초기화</button>
      <span id="rv-zoom-hint">핀치로 확대 · 더블탭으로 2배</span>
    </div>` : ""}
    <div id="rv-body">
      <div id="rv-loading">
        <div class="rv-spinner"></div>
        <span>파일을 불러오는 중...</span>
      </div>
    </div>`;

  document.body.appendChild(overlay);
  lockBodyScroll();

  const bodyEl    = overlay.querySelector("#rv-body");
  const loadingEl = overlay.querySelector("#rv-loading");
  const zoomLabel = overlay.querySelector("#rv-zoom-label");

  const closeViewer = () => {
    overlay.remove();
    unlockBodyScroll();
    document.removeEventListener("keydown", onKey);
  };
  const onKey = (e) => { if (e.key === "Escape") closeViewer(); };
  overlay.querySelector("#rv-close-btn").addEventListener("click", closeViewer);
  overlay.querySelector("#rv-save-btn").addEventListener("click", handleSave);
  document.addEventListener("keydown", onKey);

  if (isPdf) {
    _renderPdf(bodyEl, loadingEl, blob, mime, fileName, rawDataUrl).then(() => {
      if (showZoomBar) _attachZoomControls(overlay, bodyEl, zoomLabel);
    });
  } else if (isImg) {
    _renderImage(bodyEl, loadingEl, blob, fileName);
    if (showZoomBar) {
      setTimeout(() => _attachZoomControls(overlay, bodyEl, zoomLabel), 300);
    }
  } else {
    _renderFallback(bodyEl, loadingEl, fileName, handleSave);
  }
}

function _attachZoomControls(overlay, bodyEl, zoomLabelEl) {
  const existingChildren = Array.from(bodyEl.children).filter(c => c.id !== "rv-loading");
  const wrap = document.createElement("div");
  wrap.id = "rv-transform-wrap";
  existingChildren.forEach(c => wrap.appendChild(c));
  bodyEl.appendChild(wrap);

  const ctrl = createZoomController(bodyEl, wrap, zoomLabelEl);

  const btnIn    = overlay.querySelector("#rv-zoom-in");
  const btnOut   = overlay.querySelector("#rv-zoom-out");
  const btnReset = overlay.querySelector("#rv-zoom-reset");
  if (btnIn)    btnIn.addEventListener("click",    () => ctrl.zoomIn());
  if (btnOut)   btnOut.addEventListener("click",   () => ctrl.zoomOut());
  if (btnReset) btnReset.addEventListener("click", () => ctrl.zoomReset());
}

async function _renderPdf(bodyEl, loadingEl, blob, mime, fileName, rawDataUrl) {
  try {
    const pdfjsLib = await loadPdfJs();
    await _renderPdfWithPdfJs(bodyEl, loadingEl, blob, pdfjsLib);
    return;
  } catch (err) {
    console.warn("[PDF.js] 로드/렌더링 실패, iframe 방식으로 폴백:", err);
  }
  _renderPdfIframeFallback(bodyEl, loadingEl, blob, mime, fileName, rawDataUrl);
}

async function _renderPdfWithPdfJs(bodyEl, loadingEl, blob, pdfjsLib) {
  const arrayBuffer = await blob.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

  const wrap = document.createElement("div");
  wrap.id = "rv-pdf-pages";
  bodyEl.appendChild(wrap);

  const outputScale  = window.devicePixelRatio || 1;
  const targetWidth  = Math.max(280, (bodyEl.clientWidth || window.innerWidth) - 20);

  for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
    const page = await pdf.getPage(pageNum);
    const baseViewport = page.getViewport({ scale: 1 });
    const scale = targetWidth / baseViewport.width;
    const viewport = page.getViewport({ scale });

    const canvas = document.createElement("canvas");
    canvas.width  = Math.floor(viewport.width * outputScale);
    canvas.height = Math.floor(viewport.height * outputScale);
    canvas.style.width  = Math.floor(viewport.width) + "px";
    canvas.style.height = Math.floor(viewport.height) + "px";
    wrap.appendChild(canvas);

    const ctx = canvas.getContext("2d");
    const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;
    await page.render({ canvasContext: ctx, viewport, transform }).promise;

    if (pageNum === 1) loadingEl.style.display = "none";
  }
  if (pdf.numPages === 0) loadingEl.style.display = "none";
}

function _renderPdfIframeFallback(bodyEl, loadingEl, blob, mime, fileName, rawDataUrl) {
  const useGoogleProxy = ENV.isIOS && (ENV.iosVersion > 0 && ENV.iosVersion < 15);
  if (!useGoogleProxy) {
    const blobUrl = makeBlobUrl(blob, 300_000);
    const iframe = document.createElement("iframe");
    iframe.id    = "rv-pdf-frame";
    iframe.title = fileName || "첨부파일";
    iframe.setAttribute("allowfullscreen", "");
    iframe.src = blobUrl;
    let loaded = false;
    iframe.addEventListener("load", () => { loaded = true; loadingEl.style.display = "none"; });
    setTimeout(() => { if (!loaded) loadingEl.style.display = "none"; }, 5000);
    bodyEl.appendChild(iframe);
  } else {
    const pdfDataUrl = rawDataUrl || "";
    const srcdoc = `<!DOCTYPE html><html><head><meta charset="UTF-8">
      <style>*{margin:0;padding:0;}html,body{width:100%;height:100%;overflow:hidden;}
      object,embed{display:block;width:100%;height:100%;border:none;}
      </style></head><body>
      <object data="${pdfDataUrl}" type="application/pdf">
        <embed src="${pdfDataUrl}" type="application/pdf">
      </object></body></html>`;
    const iframe = document.createElement("iframe");
    iframe.id    = "rv-pdf-frame";
    iframe.title = fileName || "첨부파일";
    iframe.setAttribute("sandbox", "allow-scripts allow-same-origin");
    iframe.srcdoc = srcdoc;
    iframe.addEventListener("load", () => { loadingEl.style.display = "none"; });
    setTimeout(() => { loadingEl.style.display = "none"; }, 4000);
    bodyEl.appendChild(iframe);
  }
}

function _renderImage(bodyEl, loadingEl, blob, fileName) {
  const blobUrl = makeBlobUrl(blob, 300_000);
  const wrap = document.createElement("div");
  wrap.id = "rv-img-wrap";
  const img = document.createElement("img");
  img.alt = fileName || "첨부 이미지";
  img.src = blobUrl;
  img.addEventListener("load",  () => { loadingEl.style.display = "none"; });
  img.addEventListener("error", () => {
    loadingEl.style.display = "none";
    wrap.innerHTML = `
      <div style="text-align:center;color:rgba(255,255,255,.6);padding:32px;">
        <div style="font-size:40px;margin-bottom:12px;">⚠️</div>
        <div style="font-size:14px;">이미지를 불러올 수 없습니다.</div>
        <div style="font-size:12px;margin-top:6px;opacity:.6;">${fileName || ""}</div>
      </div>`;
  });
  wrap.appendChild(img);
  bodyEl.appendChild(wrap);
}

function _renderFallback(bodyEl, loadingEl, fileName, handleSave) {
  loadingEl.style.display = "none";
  const div = document.createElement("div");
  div.id = "rv-fallback";
  div.innerHTML = `
    <div class="rv-icon">📄</div>
    <div class="rv-fname">${fileName ? fileName.replace(/</g,"&lt;") : "파일"}</div>
    <div class="rv-desc">
      이 파일 형식은 모바일 브라우저에서<br>직접 열람할 수 없습니다.<br>
      아래 버튼으로 기기에 저장 후 확인해 주세요.
    </div>
    <button id="rv-fallback-save" class="rv-btn rv-btn-save" style="margin-top:8px;padding:14px 32px;font-size:14px;">
      ${ENV.isIOS ? "📤 저장/공유" : "💾 파일 저장"}
    </button>`;
  div.querySelector("#rv-fallback-save").addEventListener("click", handleSave);
  bodyEl.appendChild(div);
}

/* 진입점: viewAttachment(id) — 고객의 첨부파일(견적요청서/구성도/계약서 등) 열람 */
function viewAttachment(id) {
  const customer = customersCache.find(x => x.id === id);
  if (!customer?.attachment?.dataUrl) {
    alert("첨부된 파일이 없습니다.");
    return;
  }
  const { dataUrl, mimeType, fileName } = customer.attachment;
  const resolvedMime = (() => {
    if (mimeType && mimeType !== "application/octet-stream") return mimeType;
    const ext = (fileName || "").split(".").pop().toLowerCase();
    const map = {
      pdf:"application/pdf", jpg:"image/jpeg", jpeg:"image/jpeg",
      png:"image/png", gif:"image/gif", webp:"image/webp",
      doc:"application/msword",
      docx:"application/vnd.openxmlformats-officedocument.wordprocessingml.document",
      xls:"application/vnd.ms-excel",
      xlsx:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
    };
    return map[ext] || mimeType || "application/octet-stream";
  })();
  let blob, mime;
  try {
    ({ blob, mime } = dataUrlToBlob(dataUrl, resolvedMime));
  } catch (err) {
    console.error("[viewAttachment] 변환 실패:", err);
    alert("파일 변환 오류: " + err.message);
    return;
  }
  if (!ENV.isMobile) {
    openNewTab(blob, mime, fileName);
  } else {
    openInlineViewer(blob, mime, fileName, dataUrl);
  }
}

const CUSTOMER_COLS = [
  { key:"name",         label:"고객명 / 회사", sortable:true,  align:"",       val:c=>c.name||"" },
  { key:"productName",  label:"관심 상품",     sortable:true,  align:"",       val:c=>c.productName||"" },
  { key:"infra",        label:"기존 인프라",   sortable:true,  align:"",       val:c=>c.infra||"" },
  { key:"employees",    label:"임직원수",      sortable:true,  align:"center", val:c=>c.employees??-1 },
  { key:"address",      label:"소재지",        sortable:true,  align:"",       val:c=>c.address||"" },
  { key:"budget",       label:"월 예산",       sortable:true,  align:"center", val:c=>c.budget??-1 },
  { key:"consultDate",  label:"상담일시",      sortable:true,  align:"",       val:c=>[c.consultDate||"",c.consultTime||""].join(" ").trim() },
  { key:"attachment",   label:"첨부파일",      sortable:false, align:"",       val:null },
  { key:"status",       label:"상태",          sortable:true,  align:"",       val:c=>{ const ORDER={"상담예정":0,"상담완료":1,"계약완료":2,"계약보류":3}; return ORDER[c.status]??9; } },
  { key:"actions",      label:"관리",          sortable:false, align:"",       val:null },
];

function renderCustomers(){
  let list=customersCache.slice();
  if(customerSearch.trim()){
    const t=customerSearch.trim();
    list=list.filter(c=>(c.name&&c.name.includes(t))||(c.company&&c.company.includes(t))||(c.productName&&c.productName.includes(t))||(c.phone&&c.phone.includes(t)));
  }

  if(customerSortKey){
    const col=CUSTOMER_COLS.find(c=>c.key===customerSortKey);
    if(col&&col.val){
      list.sort((a,b)=>{
        const av=col.val(a), bv=col.val(b);
        let cmp=0;
        if(typeof av==="number"&&typeof bv==="number"){
          if(av===-1&&bv===-1) cmp=0;
          else if(av===-1) cmp=1;
          else if(bv===-1) cmp=-1;
          else cmp=av-bv;
        } else {
          cmp=String(av).localeCompare(String(bv),"ko");
        }
        return customerSortDir==="asc"?cmp:-cmp;
      });
    }
  }

  const thHtml = CUSTOMER_COLS.map(col=>{
    if(!col.sortable) return `<th${col.align?` style="text-align:${col.align}"`:""}>${col.label}</th>`;
    const isActive = customerSortKey===col.key;
    const icon = isActive ? (customerSortDir==="asc"?"▲":"▼") : "⇅";
    const alignStyle = col.align ? `text-align:${col.align};` : "";
    return `<th class="sortable${isActive?" active":""}" data-action="sort-customers" data-key="${col.key}"${alignStyle?` style="${alignStyle}"`:""}>${col.label}<span class="sort-icon">${icon}</span></th>`;
  }).join("");

  const rows=list.length?list.map(c=>{
    const dtLabel=[c.consultDate,c.consultTime].filter(Boolean).join(" ")||"-";
    const attachCell=c.attachment&&c.attachment.dataUrl
      ?`<a href="javascript:void(0)" data-action="view-attachment" data-id="${c.id}" style="color:var(--brand);font-weight:600;">${esc(c.attachment.fileName||"첨부파일")}</a>`
      :`<span style="color:var(--slate-300);">미첨부</span>`;
    const consultBadge = c.consultation
      ? `<span class="badge badge-eval-done" data-action="view-consultation" data-id="${c.id}" style="margin-top:5px;display:inline-flex;cursor:pointer;" title="클릭하면 상담기록서를 확인합니다">✅ 상담기록 완료</span>`
      : "";
    const actionBtns=
      c.status==="상담예정"?`<button class="btn btn-primary btn-sm" data-action="customer-consulted" data-id="${c.id}">상담완료</button>`:
      c.status==="상담완료"?`<button class="btn btn-success btn-sm" data-action="customer-contracted" data-id="${c.id}">계약완료</button><button class="btn btn-danger btn-sm" data-action="customer-hold" data-id="${c.id}">계약보류</button>`:"";
    const empTxt    = c.employees ? `${c.employees}명` : `-`;
    const addressTxt= c.address   ? esc(c.address)     : `-`;
    const budgetTxt = fmtWon(c.budget);
    return `<tr>
      <td><div class="cell-name">${esc(c.name)}</div><div class="cell-sub">${esc(c.company||"")}${c.phone?" · "+esc(c.phone):""}</div></td>
      <td>${esc(c.productName||"-")}</td>
      <td>${esc(c.infra||"-")}</td>
      <td class="center">${empTxt}</td>
      <td><div style="font-size:12px;">${addressTxt}</div></td>
      <td class="center" style="white-space:nowrap;">${budgetTxt}</td>
      <td><div>${dtLabel}</div></td>
      <td>${attachCell}</td>
      <td><div>${statusBadge(c.status)}</div>${consultBadge}</td>
      <td class="actions">
        <button class="btn btn-secondary btn-sm" data-action="edit-customer" data-id="${c.id}">수정</button>
        <button class="btn btn-ghost btn-sm" data-action="open-consultation" data-id="${c.id}">${c.consultation?"상담기록수정":"상담기록"}</button>
        ${actionBtns}
        <button class="btn btn-danger btn-xs" data-action="remove-customer" data-id="${c.id}">삭제</button>
      </td>
    </tr>`;}).join(""):
    `<tr class="empty-row"><td colspan="10"><span class="empty-icon">🗂</span>${customerSearch?"검색 결과가 없습니다.":"등록된 고객이 없습니다."}</td></tr>`;

  const sortStatusLabel = customerSortKey
    ? `<span style="font-size:11px;color:var(--brand);font-weight:600;margin-left:8px;">정렬: ${CUSTOMER_COLS.find(c=>c.key===customerSortKey)?.label} ${customerSortDir==="asc"?"↑":"↓"}</span>
       <button class="btn btn-ghost btn-xs" data-action="sort-reset" style="margin-left:4px;">초기화</button>`
    : `<span style="font-size:11px;color:var(--slate-400);margin-left:8px;">컬럼 헤더를 클릭하면 정렬됩니다</span>`;

  contentEl.innerHTML=`
  <div class="page-header">
    <div><div class="page-title">고객 관리</div><div class="page-subtitle">총 ${customersCache.length}건 · 상담예정 ${customersCache.filter(c=>c.status==="상담예정").length}건</div></div>
    <button class="btn btn-primary" data-action="open-customer-modal">+ 고객 등록</button>
  </div>
  <div class="panel">
    <div class="filter-row" style="align-items:center;">
      <input class="filter-input" type="text" id="customerSearch" placeholder="🔍  고객명 · 회사명 · 상품명 · 연락처 검색" value="${esc(customerSearch)}">
      <div style="display:flex;align-items:center;flex-shrink:0;">${sortStatusLabel}</div>
    </div>
    <div class="panel-body"><table>
      <thead><tr>${thHtml}</tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;

  const se = document.getElementById("customerSearch");
  if(se){
    se.addEventListener("compositionstart", ()=>{ isComposing=true; });
    se.addEventListener("compositionend",   ()=>{ isComposing=false; customerSearch=se.value; renderCustomers(); restoreFocus(); });
    se.addEventListener("input", ()=>{
      if(isComposing) return;
      customerSearch=se.value; renderCustomers(); restoreFocus();
    });
  }
  function restoreFocus(){
    const re=document.getElementById("customerSearch");
    if(re){ re.focus(); re.selectionStart=re.selectionEnd=re.value.length; }
  }
}

/* 완성된 상담기록서 모달로 바로보기 */
function viewConsultationModal(id) {
  const c = customersCache.find(x => x.id === id);
  if (!c || !c.consultation) return;

  const cs = c.consultation;
  const dt = [c.consultDate, c.consultTime].filter(Boolean).join(" ");

  const draft = {
    requirements: (cs.requirements || []).map(r => ({
      id: uid(), title: r.title||"", items: r.items||"", score: r.score||"", comment: r.comment||""
    })),
    background:  cs.background||"",
    opportunity: cs.opportunity||"",
    risks:       cs.risks||"",
    comment:     cs.comment||"",
    recommendation: cs.recommendation||"",
    salesRepName:  cs.salesRepName||"",
    salesRepTitle: cs.salesRepTitle||""
  };

  const reportText = cs.reportText || buildReport(c, draft);
  const updatedAt  = cs.updatedAt ? fmtDateTime(cs.updatedAt) : "-";

  const recEmoji = cs.recommendation === "계약추천" ? "✅" : cs.recommendation === "보류" ? "🔶" : cs.recommendation === "영업종료" ? "❌" : "";
  const recBadge = cs.recommendation
    ? `<span class="badge ${cs.recommendation==="계약추천"?"badge-passed":cs.recommendation==="보류"?"badge-scheduled":"badge-failed"}">${recEmoji} ${esc(cs.recommendation)}</span>`
    : "";

  showModal(`
  <div class="modal-head">
    <span class="modal-title">📋 고객 상담기록서 — ${esc(c.name)}</span>
    <button class="modal-close" data-action="close-modal">✕</button>
  </div>
  <div class="modal-body">
    <div class="eval-modal-meta">
      ${statusBadge(c.status)}
      ${recBadge}
      <span style="font-size:12px;color:var(--slate-400);margin-left:auto;">작성일: ${updatedAt}</span>
    </div>
    <div class="eval-modal-preview" id="consultModalPreviewText">${esc(reportText)}</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <button type="button" class="btn btn-ghost btn-sm" id="consultModalCopyBtn">📋 텍스트 복사</button>
      <button type="button" class="btn btn-ghost btn-sm" data-action="open-consultation" data-id="${id}">✏️ 상담기록 수정</button>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-action="close-modal">닫기</button>
  </div>`, true);

  document.getElementById("consultModalCopyBtn")?.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(reportText);
      alert("클립보드에 복사되었습니다.");
    } catch(e) {
      alert("자동 복사 실패. 직접 선택하여 복사해 주세요.");
    }
  });
}

function initConsultDraft(customer){
  const ex=customer&&customer.consultation;
  if(ex&&ex.requirements&&ex.requirements.length){
    consultDraft={
      requirements:ex.requirements.map(r=>({id:uid(),title:r.title||"",items:r.items||"",score:r.score||"",comment:r.comment||""})),
      background:ex.background||"", opportunity:ex.opportunity||"", risks:ex.risks||"",
      comment:ex.comment||"", recommendation:ex.recommendation||"",
      salesRepName:ex.salesRepName||"", salesRepTitle:ex.salesRepTitle||""
    };
  } else {
    consultDraft={
      requirements:DEFAULT_REQUIREMENTS.map(r=>({id:uid(),title:r.title,items:"",score:"",comment:""})),
      background:"", opportunity:"", risks:"", comment:"", recommendation:"",
      salesRepName:"", salesRepTitle:""
    };
  }
}
function openConsultationView(id){ consultationId=id; const c=customersCache.find(x=>x.id===id); initConsultDraft(c); currentView="consultationForm"; rerender(); }

function calcTotalScore(draft){
  const scored=draft.requirements.filter(r=>r.score);
  if(!scored.length)return{total:0,avg:"-",grade:"-"};
  const sum=scored.reduce((acc,r)=>acc+(SCORE_POINT[r.score]||0),0);
  const avg=(sum/scored.length).toFixed(1);
  let grade="-";
  if(avg>=3.5)grade="A(매우적합)"; else if(avg>=2.5)grade="B(적합)"; else if(avg>=1.5)grade="C(보통)"; else grade="D(부적합)";
  return{total:sum,avg,grade};
}

function buildReport(customer, draft){
  const lines=[];
  const company=settingsCache.companyName||"";
  const dt=[customer.consultDate,customer.consultTime].filter(Boolean).join(" ");
  lines.push(`${"═".repeat(38)}`);
  lines.push(`  고 객 상 담 기 록 서${company?" ("+company+")":""}`);
  lines.push(`${"═".repeat(38)}`);
  lines.push(`고  객   : ${customer.name||"-"}${customer.company?" / "+customer.company:""}`);
  lines.push(`관심상품 : ${customer.productName||"-"}`);
  lines.push(`상담일시 : ${dt||"-"}`);
  if(draft.salesRepName) lines.push(`담당영업 : ${draft.salesRepName}${draft.salesRepTitle?" ("+draft.salesRepTitle+")":""}`);
  lines.push(`${"─".repeat(38)}`);
  const filledReq = draft.requirements.filter(r=>r.title.trim()||(r.items&&r.items.trim())||r.score||r.comment);
  if(filledReq.length){
    lines.push(`[요구사항 분석]`);
    filledReq.forEach((r,i)=>{
      const scoreLabel=r.score?` ▶ ${r.score}`:"";
      lines.push(``);
      lines.push(`${i+1}. ${r.title||"평가 항목"}${scoreLabel}`);
      if(r.items&&r.items.trim()){
        r.items.split("\n").map(s=>s.trim()).filter(Boolean).forEach((s,j)=>{
          const CIRC=["①","②","③","④","⑤","⑥","⑦","⑧","⑨","⑩"];
          lines.push(`   ${CIRC[j]||(j+1)+"."} ${s}`);
        });
      }
      if(r.comment&&r.comment.trim()) lines.push(`   → ${r.comment.trim()}`);
    });
    const {avg,grade}=calcTotalScore(draft);
    if(avg!=="-") lines.push(`\n   ※ 종합 적합도 평균: ${avg}점 / 종합 등급: ${grade}`);
    lines.push(`${"─".repeat(38)}`);
  }
  if(draft.background&&draft.background.trim()){
    lines.push(`[도입 배경 및 특이사항]`);
    draft.background.split("\n").map(s=>s.trim()).filter(Boolean).forEach((s,j)=>{ const CIRC=["①","②","③","④","⑤"]; lines.push(`  ${CIRC[j]||(j+1)+"."} ${s}`); });
    lines.push(`${"─".repeat(38)}`);
  }
  if(draft.opportunity&&draft.opportunity.trim()){
    lines.push(`[영업 기회 · 기대 효과]`);
    draft.opportunity.split("\n").map(s=>s.trim()).filter(Boolean).forEach((s,j)=>{ const CIRC=["①","②","③","④","⑤"]; lines.push(`  ${CIRC[j]||(j+1)+"."} ${s}`); });
    lines.push(`${"─".repeat(38)}`);
  }
  if(draft.risks&&draft.risks.trim()){
    lines.push(`[우려사항 및 리스크]`);
    draft.risks.split("\n").map(s=>s.trim()).filter(Boolean).forEach((s,j)=>{ const CIRC=["①","②","③","④","⑤"]; lines.push(`  ${CIRC[j]||(j+1)+"."} ${s}`); });
    lines.push(`${"─".repeat(38)}`);
  }
  if(draft.comment&&draft.comment.trim()){
    lines.push(`[종합 의견]`);
    lines.push(`  ${draft.comment.trim()}`);
    lines.push(`${"─".repeat(38)}`);
  }
  if(draft.recommendation){
    const recEmoji=draft.recommendation==="계약추천"?"✅":draft.recommendation==="보류"?"🔶":"❌";
    lines.push(`[계약 추천 여부]  ${recEmoji} ${draft.recommendation}`);
    lines.push(`${"─".repeat(38)}`);
  }
  lines.push(`작성일: ${new Date().toLocaleDateString("ko-KR")}`);
  if(draft.salesRepName) lines.push(`담당영업: ${draft.salesRepName}  (서명: ____________)`);
  return lines.join("\n");
}

function syncDraft(){
  if(!consultDraft)return;
  consultDraft.requirements.forEach(r=>{
    const t=document.querySelector(`[data-req-title="${r.id}"]`); if(t)r.title=t.value;
    const i=document.querySelector(`[data-req-items="${r.id}"]`); if(i)r.items=i.value;
    const cm=document.querySelector(`[data-req-comment="${r.id}"]`); if(cm)r.comment=cm.value;
  });
  const bg=document.getElementById("consultBackground");  if(bg)consultDraft.background=bg.value;
  const op=document.getElementById("consultOpportunity"); if(op)consultDraft.opportunity=op.value;
  const r=document.getElementById("consultRisks");        if(r)consultDraft.risks=r.value;
  const co=document.getElementById("consultComment");     if(co)consultDraft.comment=co.value;
  const n=document.getElementById("consultRepName");      if(n)consultDraft.salesRepName=n.value;
  const ti=document.getElementById("consultRepTitle");    if(ti)consultDraft.salesRepTitle=ti.value;
}

function updateConsultPreview(){
  const c=customersCache.find(x=>x.id===consultationId);
  const el=document.getElementById("consultPreview");
  if(!c||!el||!consultDraft)return;
  el.textContent=buildReport(c,consultDraft);
  const sv=document.getElementById("totalScoreVal");
  if(sv){ const {avg}=calcTotalScore(consultDraft); sv.textContent=avg!=="-"?avg:"—"; }
}

function addReqBlock(){ syncDraft(); consultDraft.requirements.push({id:uid(),title:"",items:"",score:"",comment:""}); renderConsultationForm(); }
function removeReqBlock(id){ syncDraft(); if(consultDraft.requirements.length<=1){alert("최소 1개는 남아야 합니다.");return;} consultDraft.requirements=consultDraft.requirements.filter(r=>r.id!==id); renderConsultationForm(); }

function setScore(reqId,score){
  syncDraft();
  const r=consultDraft.requirements.find(x=>x.id===reqId);
  if(r){ r.score=r.score===score?"":score; }
  updateConsultPreview();
  document.querySelectorAll(`[data-action="set-score"][data-id="${reqId}"]`).forEach(btn=>{
    btn.classList.toggle("selected", btn.dataset.score===r.score);
  });
  const sv=document.getElementById("totalScoreVal");
  if(sv){ const {avg}=calcTotalScore(consultDraft); sv.textContent=avg!=="-"?avg:"—"; }
}
function setRec(rec){
  syncDraft();
  consultDraft.recommendation=consultDraft.recommendation===rec?"":rec;
  updateConsultPreview();
  document.querySelectorAll(`[data-action="set-rec"]`).forEach(btn=>{
    btn.className="rec-btn";
    if(btn.dataset.rec===consultDraft.recommendation){
      if(rec==="계약추천")btn.classList.add("selected-pass");
      else if(rec==="보류")btn.classList.add("selected-hold");
      else if(rec==="영업종료")btn.classList.add("selected-reject");
    }
  });
}

  const reportText=buildReport(c,consultDraft);

    await updateDoc(doc(db,"customers",c.id),{consultation:{
      requirements:consultDraft.requirements.map(r=>({title:r.title,items:r.items,score:r.score,comment:r.comment})),

      comment:consultDraft.comment, recommendation:consultDraft.recommendation,
      salesRepName:consultDraft.salesRepName, salesRepTitle:consultDraft.salesRepTitle,
      reportText, updatedAt:serverTimestamp()
    }});
    if(settingsCache.autoNotify!==false) notify(`${c.name}님의 고객 상담기록서가 저장되었습니다.`,"evaluation");
    alert("상담기록서가 저장되었습니다.");

}

async function copyConsultation(){
  syncDraft();
  const c=customersCache.find(x=>x.id===consultationId); if(!c)return;
  try{ await navigator.clipboard.writeText(buildReport(c,consultDraft)); alert("클립보드에 복사되었습니다."); }
  catch(e){ alert("자동 복사 실패. 미리보기 영역을 직접 선택해 복사해주세요."); }
}

function renderContracts(){
  const list=customersCache.filter(c=>c.status==="계약완료");
  const contractedCnt=list.filter(c=>c.contractCreated).length;
  const mrr=list.filter(c=>c.contractCreated&&c.contract?.monthlyFee).reduce((s,c)=>s+Number(c.contract.monthlyFee||0),0);
  const rows=list.length?list.map(c=>{
    const ct=c.contract||{};
    const startTxt  = ct.startDate ? ct.startDate : "-";
    const feeTxt    = ct.monthlyFee ? `${Number(ct.monthlyFee).toLocaleString()}만/월` : "-";
    const contractBtn = c.contractCreated
      ? `<button class="btn btn-secondary btn-sm" data-action="register-contract" data-id="${c.id}">✎ 계약 수정</button>`
      : `<button class="btn btn-success btn-sm" data-action="register-contract" data-id="${c.id}">계약 등록</button>`;
    const contractStatus = c.contractCreated
      ? `<span class="badge badge-contract">계약완료</span>`
      : `<span class="badge badge-closed">미등록</span>`;
    return `<tr>
    <td><div class="cell-name">${esc(c.name)}</div><div class="cell-sub">${esc(c.company||"")}</div></td>
    <td>${esc(ct.product||c.productName||"-")}</td>
    <td>${esc(c.email||"-")}</td>
    <td>${esc(c.phone||"-")}</td>
    <td class="center">${c.consultDate||"-"}</td>
    <td class="center">${startTxt}</td>
    <td class="center" style="white-space:nowrap;">${feeTxt}</td>
    <td class="center">${contractStatus}</td>
    <td class="actions">
      ${contractBtn}
      <button class="btn btn-ghost btn-sm" data-action="edit-customer" data-id="${c.id}">정보수정</button>
    </td>
  </tr>`;}).join(""):
  `<tr class="empty-row"><td colspan="9"><span class="empty-icon">📄</span>계약 완료 고객이 없습니다.</td></tr>`;
  contentEl.innerHTML=`
  <div class="page-header">
    <div><div class="page-title">계약 고객 관리</div><div class="page-subtitle">계약 및 이용료 현황 · 총 ${list.length}건 · 계약등록 ${contractedCnt}건 · MRR ${mrr.toLocaleString()}만원</div></div>
  </div>
  <div class="panel">
    <div class="panel-body"><table>
      <thead><tr><th>고객</th><th>이용 상품</th><th>이메일</th><th>연락처</th><th style="text-align:center">상담일</th><th style="text-align:center">이용 시작일</th><th style="text-align:center">월 이용료</th><th style="text-align:center">계약상태</th><th>관리</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;
}
function openContractSimpleModal(customerId){
  const c=customersCache.find(x=>x.id===customerId); if(!c)return;
  const ct=c.contract||{};
  showModal(`
  <div class="modal-head"><span class="modal-title">${c.contractCreated?"계약 정보 수정":"계약 등록"} — ${esc(c.name)}</span><button class="modal-close" data-action="close-modal">✕</button></div>
  <div class="modal-body"><form id="contractSimpleForm">
    <div class="form-group"><label>이용 시작일</label><input class="form-control" type="date" name="startDate" value="${esc(ct.startDate||"")}"></div>
    <div class="form-group"><label>이용 상품</label><input class="form-control" name="product" value="${esc(ct.product||c.productName||"")}"></div>
    <div class="form-group"><label>월 이용료 (만원)</label><input class="form-control" type="number" name="monthlyFee" min="0" value="${ct.monthlyFee??0}"></div>
    <div class="form-group"><label>비고</label><textarea class="form-control" name="memo" rows="2" placeholder="계약 관련 특이사항">${esc(ct.memo||"")}</textarea></div>
    <div class="modal-footer" style="padding:0;border:none;margin-top:4px;">
      <button type="button" class="btn btn-secondary" data-action="close-modal">취소</button>
      ${c.contractCreated?`<button type="button" class="btn btn-danger" id="cancelContractBtn">계약 취소</button>`:""}
      <button type="submit" class="btn btn-primary">저장</button>
    </div>
  </form></div>`);
  document.getElementById("contractSimpleForm").addEventListener("submit",async e=>{
    e.preventDefault();
    const fd=new FormData(e.target);
    const contract={
      startDate: fd.get("startDate")||"",
      product:   fd.get("product").trim(),
      monthlyFee: Number(fd.get("monthlyFee"))||0,
      memo:      fd.get("memo").trim(),
      updatedAt: serverTimestamp()
    };
    try{
      await updateDoc(doc(db,"customers",c.id),{contractCreated:true,contract});
      notify(`${c.name}님의 계약 정보가 ${c.contractCreated?"수정":"등록"}되었습니다.`,"contract");
      closeModal();
    }
    catch(err){ alert("저장 오류: "+err.message); }
  });
  const cancelBtn=document.getElementById("cancelContractBtn");
  if(cancelBtn){
    cancelBtn.addEventListener("click",async()=>{
      if(!confirm(`${c.name}님의 계약 등록을 취소하시겠습니까? (계약 상세정보는 유지되며 상태만 미등록으로 변경됩니다)`))return;
      try{ await updateDoc(doc(db,"customers",c.id),{contractCreated:false}); closeModal(); }
      catch(err){ alert("취소 오류: "+err.message); }
    });
  }
}

function renderNotifications(){
  const unread=notificationsCache.filter(n=>!n.read).length;
  const items=notificationsCache.length?notificationsCache.map(n=>`
  <div class="notif-item ${n.read?"":"unread"}">
    <div style="display:flex;gap:10px;align-items:flex-start;min-width:0;">
      ${!n.read?`<div class="notif-dot"></div>`:`<div style="width:8px;flex-shrink:0;"></div>`}
      <div style="min-width:0;"><div class="notif-text">${esc(n.message)}</div><div class="notif-time">${fmtDateTime(n.createdAt)}</div></div>
    </div>
    <div class="toolbar" style="flex-shrink:0;">
      ${!n.read?`<button class="btn btn-ghost btn-xs" data-action="mark-notif-read" data-id="${n.id}">읽음</button>`:""}
      <button class="btn btn-danger btn-xs" data-action="delete-notif" data-id="${n.id}">삭제</button>

  `<div style="text-align:center;padding:44px;color:var(--slate-400);"><div style="font-size:32px;margin-bottom:10px;">🔔</div>알림이 없습니다.</div>`;
  contentEl.innerHTML=`
  <div class="page-header">
    <div><div class="page-title">알림 관리</div><div class="page-subtitle">읽지 않은 알림 ${unread}건</div></div>
  </div>
  <div class="panel" style="margin-bottom:16px;">
    <div class="panel-inner" style="padding-bottom:16px;">
      <form id="notifForm" style="display:flex;gap:10px;">
        <input class="filter-input" name="message" placeholder="알림 내용을 입력하세요" required style="flex:1;">
        <button type="submit" class="btn btn-primary">추가</button>
      </form>
    </div>
  </div>
  <div class="panel"><div>${items}</div></div>`;
  document.getElementById("notifForm").addEventListener("submit",async e=>{ e.preventDefault(); const fd=new FormData(e.target); const msg=fd.get("message").trim(); if(!msg)return; await notify(msg,"manual"); e.target.reset(); });
}
async function markRead(id){ try{ await updateDoc(doc(db,"notifications",id),{read:true}); }catch(e){} }

/* 이벤트 위임 */
contentEl.addEventListener("click",e=>{
  const el=e.target.closest("[data-action]"); if(!el)return;
  const action=el.dataset.action, id=el.dataset.id;
  switch(action){
    case"go-customers":         switchView("customers"); break;
    case"sort-customers":
      if(customerSortKey===el.dataset.key){
        customerSortDir = customerSortDir==="asc"?"desc":"asc";
      } else {
        customerSortKey = el.dataset.key;
        customerSortDir = "asc";
      }
      renderCustomers(); break;
    case"sort-reset":           customerSortKey=""; customerSortDir="asc"; renderCustomers(); break;
    case"open-product-modal":   openProductModal(); break;
    case"edit-product":         openProductModal(id); break;
    case"remove-product":       removeProduct(id); break;
    case"open-customer-modal":  openCustomerModal(); break;
    case"edit-customer":        openCustomerModal(id); break;
    case"remove-customer":      removeCustomer(id); break;
    case"view-attachment":      viewAttachment(id); break;
    case"customer-consulted":   updateStatus(id,"상담완료"); break;
    case"customer-contracted":  updateStatus(id,"계약완료"); break;
    case"customer-hold":        updateStatus(id,"계약보류"); break;
    case"register-contract":    openContractSimpleModal(id); break;
    case"mark-notif-read":      markRead(id); break;
    case"delete-notif":         deleteNotif(id); break;
    case"open-admin-modal":     openAdminModal(); break;
    case"remove-admin":         removeAdmin(id); break;
    case"open-consultation":    closeModal(); openConsultationView(id); break;
    case"view-consultation":    viewConsultationModal(id); break;
    case"back-to-customers":    consultationId=null; consultDraft=null; switchView("customers"); break;
    case"add-req-block":        addReqBlock(); break;
    case"remove-req-block":     removeReqBlock(id); break;
    case"set-score":            setScore(id, el.dataset.score); break;
    case"set-rec":               setRec(el.dataset.rec); break;
    case"save-consultation":    saveConsultation(); break;
    case"copy-consultation":    copyConsultation(); break;
    case"print-consultation":   printConsultation(); break;
    case"close-modal":          closeModal(); break;
  }
});

/* 사이드바 */
const sidebarEl=document.getElementById("sidebar");
const backdropEl=document.getElementById("sidebarBackdrop");
const menuToggleEl=document.getElementById("menuToggle");
function toggleSidebar(open){ const will=open!==undefined?open:!sidebarEl.classList.contains("open"); sidebarEl.classList.toggle("open",will); backdropEl.classList.toggle("show",will); }
menuToggleEl.addEventListener("click",()=>toggleSidebar());
backdropEl.addEventListener("click",()=>toggleSidebar(false));
document.querySelectorAll(".sidebar-nav a[data-view]").forEach(el=>{ el.addEventListener("click",()=>{ switchView(el.dataset.view); toggleSidebar(false); }); });

/* Firestore 리스너 */
function setupListeners(){
  onSnapshot(colProducts,     snap=>{ productsCache=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.toMillis?.())||0-(a.createdAt?.toMillis?.())||0); rerender(); },e=>console.error(e));
  onSnapshot(colCustomers,    snap=>{ customersCache=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.toMillis?.())||0-(a.createdAt?.toMillis?.())||0); rerender(); },e=>console.error(e));
  onSnapshot(colNotifications,snap=>{ notificationsCache=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.toMillis?.())||0-(a.createdAt?.toMillis?.())||0); rerender(); },e=>console.error(e));
  onSnapshot(colAdmins,       snap=>{ adminsCache=snap.docs.map(d=>({id:d.id,...d.data()})); rerender(); },e=>console.error(e));
  onSnapshot(settingsDocRef,  snap=>{ settingsCache=snap.exists()?snap.data():{}; rerender(); },e=>console.error(e));
}

/* 로그인 */
const loginScreenEl=document.getElementById("loginScreen");
const loginFormEl=document.getElementById("loginForm");
const loginErrorEl=document.getElementById("loginError");
const authLabelEl=document.getElementById("authUserLabel");
const logoutBtnEl=document.getElementById("logoutBtn");
let listenersStarted=false;

loginFormEl.addEventListener("submit",async e=>{
  e.preventDefault(); loginErrorEl.style.display="none";
  const fd=new FormData(e.target);
  try{ await signInWithEmailAndPassword(auth,fd.get("email").trim(),fd.get("password")); }
  catch(err){ loginErrorEl.style.display="block"; }
});
logoutBtnEl.addEventListener("click",()=>signOut(auth));
onAuthStateChanged(auth,user=>{
  if(user){
    loginScreenEl.style.display="none";
    authLabelEl.textContent=user.email||"";
    logoutBtnEl.style.display="inline-flex";
    if(!listenersStarted){ listenersStarted=true; setupListeners(); switchView("dashboard"); }
  } else {
    loginScreenEl.style.display="flex";
    authLabelEl.textContent=""; logoutBtnEl.style.display="none";
    loginFormEl.reset(); loginErrorEl.style.display="none";
  }
});
</script>
